# RELEASE.yaml — what ships to production
#
# The production library is BUILT from this file by scripts/build-production.sh.
# A skill in library/ that is not listed here does not ship. Nothing is
# released by accident: adding a name below is a deliberate, reviewable edit.
#
# Workflow:
#   1. author in library/ via .aai/skills/admin.md   (dev only, not shipped)
#   2. exercise it until you trust it
#   3. add its name here
#   4. scripts/build-production.sh                   (rebuilds the prod folder)
#
# To pull a skill back: delete its line and rebuild. The build uses
# `rsync --delete`, so it disappears from production on the next run.
#
# Seeded 53 names on 2026-08-11 from library/catalog.yaml — everything that
# was already reaching production when the manifest was introduced, so the
# first build is a no-op. New skills default to UNRELEASED from here on.

