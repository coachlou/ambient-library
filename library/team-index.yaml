publish-article:
  description: Publishes a finished Markdown article to aimmhub.coachlou.com (KB ingest, deploy,
    verify); use for "publish this article", "get this online", "put it on the hub". Not for
    writing or editing.
  summary: 'Final step in the writing pipeline: takes a finished Markdown article and puts
    it live on aimmhub.coachlou.com. Input is the path to a finished .md file, with an optional
    user-supplied slug (default is the kebab-case title). Output is the live URL plus commit
    hashes from okf-kb and aimm-hub. It is a pure orchestrator: copies the file into okf-kb/inbox/articles/,
    checks a 12-character sha256 against the ledger to skip already-ingested items, then hands
    ingest to okf-kb''s own articles workflow (concept, index, validation, ledger, commit),
    pushes okf-kb, runs aimm-hub''s `npm run deploy` (cache clear, sync, build, wrangler deploy),
    verifies HTTP 200 on the workers.dev mirror because the custom domain sits behind Cloudflare
    Access, then commits and pushes the synced content copy. Default is straight through to
    live and pushed; invoking it is consent, but "just save it", "don''t deploy" or "stage
    it" stops after ingest and reports the article as publishable, not published. Gotchas
    it enforces: git push alone deploys nothing, content/articles is an rsync --delete copy
    that must never be hand-edited, stage specific files only, request directory access when
    needed, and a slug collision is passed back to the user to decide. A deploy failure stops
    with the error output, no blind retries. It never writes, edits, or fact-checks the article.
    Stage: publish.'
  requests:
  - '''Publish this article'' with a path to a finished markdown file'
  - '''Get this online on the hub'''
  - '''Put it on aimmhub'''
  - '''Ship ~/drafts/why-agents-fail.md to the AIMM hub and verify it''s live'''
  - '''Stage this article in the KB but don''t deploy yet'''
  - '''Update the live version of my existing hub article with this revised file'''
  not_for:
  - aimm-writing-team: Wins when the article still needs to be researched, drafted and edited;
      it only ends at a draft or its own Publisher role.
  - editor: Wins when the draft needs polishing or tightening before anything goes live.
  - writing-team: Wins when the user wants the whole idea-to-finished-piece pipeline rather
      than just putting a finished piece online.
  - aimm-newsletter: Wins when the goal is emailing content to a Google Contacts group, not
      publishing on the hub.
  - aimm-commands: Wins for named AIMM prompt commands run on input, which do not deploy anything.
  stage: publish
  source_hash: e12bfa359ea0
aimm-writing-team:
  description: Autonomous multi-role team (Researcher, Strategist, Writer, Editor, Publisher)
    for thought-leadership articles; use for explicit role commands like "Use Strategist mode"
    or a full AIMM article run.
  summary: 'An autonomous five-role pipeline that turns a single prompt into a thought-leadership
    article: aimm-researcher, aimm-strategist, aimm-writer, aimm-editor and aimm-publisher.
    Input is a topic, audience, requested length and target outlet, optionally source material
    or URLs. In autonomous mode it detects the task stage and runs the roles in order; in
    manual override mode a phrase like "Use Strategist mode" or "Act as the Editor" activates
    only that role while keeping shared context. Gotchas up front: it stops if the user cites
    original content or a framework that has not been read yet, requires access to the source,
    identifies the originator, and credits them prominently in the opening paragraphs rather
    than footnotes. Voice preferences are baked in: natural conversational openings, no "picture
    this" vignettes, direct address, show not tell. Each role scores itself 1 to 5 on clarity,
    novelty, flow, engagement and credibility, revises anything under 4, and records meta-reflection.
    Output is a final article with headline, subhead, summary and optional SEO tags, a reflection
    report with scores and top improvements, and a text excerpt of a conceptual memory schema
    of recurring issues per role. Persistence is simulated unless code execution can write
    files. Stage: draft, covering the whole research-to-publish-package run.'
  requests:
  - Write a 1,200-word thought-leadership article on AI ethics for entrepreneurs
  - 'Use Strategist mode: outline an article on sustainable entrepreneurship for Fast Company'
  - Act as the Editor and tighten this draft
  - Run the AIMM writing team on psychological safety in remote teams for HR readers
  - research, strategize, write, edit and package an 800-word piece for LinkedIn
  - build an article on this framework from the source I'm linking, with proper credit to
    the author
  not_for:
  - brand-writing-team: wins when the piece is brand-building content that needs the structured
      intake of voice, avatar and writing-type files.
  - writing-team: wins for a generic research, draft, edit pipeline with no AIMM role or reflection
      engine needed.
  - editor: wins when a complete draft already exists and only surgical edits are needed.
  - editorial-desk: wins for a critiqued and revised opinion or POV essay with adversary and
      headline contributors.
  - publish-article: wins when the finished Markdown just needs deploying to the hub.
  stage: draft
  source_hash: ad2ac6f78a84
audit-fix:
  description: Adversarial six-lens audit (errors, omissions, oversights, blind spots, conflicts,
    duplications) of a plan or change, then root-cause fixes; use for "audit this", "pressure
    test", "poke holes", "what did we miss".
  summary: 'Runs the full audit motion on a plan, spec, change or piece of reasoning: attack
    it, keep only findings that earn their place, fix survivors at the root cause, and leave
    surrounding docs consistent. Input is the target artifact (the most recent one when ambiguous),
    whether it is an output or the reasoning process itself, and a mode: full (audit, fix,
    verify, the default) or report-only when the user says "just audit". The adversarial pass
    applies six lenses in order: errors, omissions, oversights, blind spots, conflicts, duplications,
    plus extra checks for diffs. When this session authored the artifact, the pass runs in
    a cold spawned agent that sees only the artifact and a one-line purpose, never the rationale;
    process audits export the full reasoning trace and always run cold. The earn filter is
    a real gate: a finding must change the outcome, and discards are listed visibly with a
    one-line reason. Fixes target the shared choke point after grepping every caller, doc
    and copy that reaches the defect, never a symptom patch. It never weakens a verify to
    make it pass and re-reads the real artifact instead of auditing from memory. Output is
    findings with survivors and discards, applied root-cause fixes, and a verification result,
    or just the report in report-only mode. Stage: audit, usable on a plan before building
    or on a change before shipping.'
  requests:
  - audit this plan and fix what's wrong
  - pressure test this spec before I hand it off
  - poke holes in my approach, what did we miss?
  - audit the diff and fix the root causes
  - 'report only: audit this strategy, don''t change anything'
  - audit how we got to this recommendation, the reasoning itself
  not_for:
  - audit-mcp: wins when the target is a third-party MCP server repo that needs a security
      audit before install.
  - skill-auditor: wins when auditing a skill's SKILL.md and catalog entry against the library
      schema.
  - gauntlet: wins when ambitious work should go through explicit criteria and multiple independent
      critique and revision rounds.
  - fresh-eyes: wins for a quick cold read of an artifact without the fix pass.
  - aimm-commands: wins when the user names a specific AIMM audit command such as constraint-first-audit.
  stage: audit
  source_hash: 547950ca45e9
audit-mcp:
  description: Security-audits a third-party MCP server repo before installation; use for
    "audit this MCP", "is this MCP safe", "check this repo before I install it".
  summary: 'Security-audits a third-party MCP server repository before the user installs it.
    Input is a GitHub repo URL (required, asked for if absent) and an optional branch defaulting
    to main. The skill bootstraps scripts/audit-mcp.sh into ~/.claude/scripts if missing,
    then runs it to clone or update the repo under ~/mcp-audits and execute automated checks:
    dependency vulnerabilities via npm audit, secret scanning with TruffleHog, Semgrep static
    analysis, eval/exec and child_process usage, outbound network calls and their destinations,
    tool poisoning and prompt injection via mcp-scan, OAuth scope review including full-mailbox
    scopes, and logging of sensitive data. It then finds the latest timestamped report, treats
    the file rather than truncated stdout as authoritative, and returns a plain-English verdict
    of PASS, PASS WITH CAVEATS or FAIL with a per-check table, only the real findings, and
    the saved report path. Any mcp-scan finding is an automatic FAIL; hardcoded secrets in
    source, eval/exec in server code, unknown outbound hosts or full mailbox scope also fail.
    It filters known false positives such as placeholder credentials in node_modules and transitive-only
    npm vulnerabilities, installs with --ignore-scripts so install hooks never execute, and
    skips missing tools with a note. It does not install the MCP or fix its code. Stage: audit,
    a gate before setup.'
  requests:
  - 'audit this MCP: https://github.com/someone/gmail-mcp'
  - is this MCP safe to install?
  - check this repo before I add it to Claude Desktop
  - run a security check on this MCP server on the dev branch
  - does this MCP server do anything sketchy with my email?
  - re-audit that MCP repo, it was updated
  not_for:
  - audit-fix: wins for auditing a plan, diff or reasoning for logic, omission and conflict
      defects rather than third-party code security.
  - skill-auditor: wins when the target is a skill's frontmatter and schema conformance.
  - connector-bridge: wins when the question is which already-available MCP tool satisfies
      a declared connector need.
  - gmail-manager: wins when the user wants to use an installed Gmail MCP for mailbox actions,
      not vet it.
  stage: audit
  source_hash: c7ed73ea967e
brand-writing-team:
  description: Multi-role team for brand-building long-form content with structured intake,
    end to end; use for "help me write a post about X", "turn this idea into a piece" when
    the goal is personal/company brand.
  summary: 'An orchestrator that coordinates a small specialist team to take a raw idea to
    a publishable brand-building long-form piece: blog post, newsletter, thought-leadership
    article, personal story or how-to tutorial. The orchestrator coordinates and never writes
    prose; only the Drafter does. Step 0 is a mandatory structured intake via AskUserQuestion:
    topic (taken inline), type of writing, audience avatar, brand voice and target length,
    with options discovered by globbing resources/brand-voices, audience-avatars and writing-types
    each run, stopping if a folder is empty. Intake may be skipped when all five inputs are
    given, when the user says "run it with defaults" (experience-insight-guide voice, Maya
    avatar, blog, about 900 words; newsletters cap at 1,000), or when polishing a partial
    draft, which starts at the Skeptic and avatar second pass. For broad topics it offers
    three orthogonal, non-modal angle options first. Roles each own one decision and hand
    off structured artifacts: Strategist (angle and thesis), Researcher (evidence), Avatar
    Reviewer (consulted twice), Outliner, Drafter, Skeptic (red-team and fact-check) and Line
    Editor (final polish). Roles do not rewrite each other, avoiding committee mush. Output
    is the finished piece in the chosen voice and length. It refuses to invent voice or avatar
    options. Stage: draft, covering strategy through final edit.'
  requests:
  - help me write a post about why most founders undercharge
  - turn this idea into a newsletter issue for my audience
  - I have an idea for a thought-leadership piece, run the team on it
  - draft a how-to tutorial on setting up my first automation, just use defaults
  - make this into a personal-story post in my brand voice
  - give me three angle options on AI for coaches, then write the best one
  not_for:
  - aimm-writing-team: wins for an AIMM-branded thought-leadership run with explicit role
      commands like "Use Strategist mode" and reflection scoring.
  - writing-team: wins for a plain research, draft, edit pipeline when no voice and avatar
      intake is needed.
  - writer: wins when a brief already exists and only a first draft is needed.
  - editor: wins when a draft exists and only surgical edits are wanted.
  - editorial-desk: wins for a critiqued opinion or POV essay with adversary and headline
      contributors.
  stage: draft
  source_hash: 528f22727399
cognitive-mirror:
  description: Live extractor for the user's cognitive profile — observes the current or recent
    conversations to model how they think, decide, and evaluate; 5 modes /loms (current chat),
    Mine (recent chats), Diff, Query, Harvest (decision instances for DSPy); use for "/loms",
    "look over my shoulder", "mine my conversations", "update my cognitive profile", "harvest
    my decisions", "how do I typically approach X", "what's my pattern when". Prefer deep-mirror
    for bulk raw-log mining, scheduling, or auditing. Data lives in ~/.aai/.
  summary: 'Live extractor that builds and maintains an evidence-based model of how the user
    thinks, decides, creates and evaluates. Works from actual conversation behavior, not self-report.
    Inputs: the current chat (all messages), or recent chats pulled through recent_chats and
    conversation_search, plus the existing profile in ~/.aai (identity.md, references/identity/,
    rules/operational/). Five modes. /loms analyzes the current conversation against extraction
    dimensions and returns a signal map and report of confirmed, new and challenged patterns
    with quoted evidence, then proposed profile and directive updates. Mine batches that over
    recent chats with frequency counts. Diff compares observations to the profile as Stable,
    Strengthened, Weakened, New or Evolved. Query answers "how do I usually approach X" from
    the profile. Harvest extracts decision instances (override, correction, reframe, rejection,
    quality gate) as JSON records into a sharded store under ~/.aai/memory/cognitive-mirror/
    for DSPy compilation, deduplicating through harvest-log.txt and tracking per-domain readiness.
    Produces reports and approved edits to identity and directive modules. Refuses to fabricate
    reasoning, prescribe self-improvement, act as a personality test, or write profile files
    without user approval. It owns the profile and harvest formats. Bulk mining of raw session
    logs on disk, scheduled maintenance and blind audits belong to deep-mirror. Stage: ongoing
    observation and profile maintenance, upstream of deep-mirror''s lifecycle runs.'
  requests:
  - /loms
  - look over my shoulder on this conversation and tell me what you notice about how I think
  - mine my recent conversations and update my cognitive profile
  - harvest my decisions from my last 10 chats
  - how do I typically approach pricing decisions
  - what's my pattern when I reject a draft
  - diff my profile against what I've been doing lately
  not_for:
  - deep-mirror: wins for bootstrapping from raw agent session logs, weekly scheduled maintenance,
      "mirror status" or the quarterly blind audit.
  - cognitive-operations: wins when the user wants structured-thinking recipes applied to
      a problem, not observation of their own patterns.
  - extract-codify-patterns: wins when the user wants a shareable look-over-my-shoulder bundle
      (README, brief, chat export) from a session.
  - conversation-ip-extractor: wins when the goal is a named, publishable framework from a
      long conversation.
  - irreplaceable-edge: wins when finding a client's competitive moat rather than the user's
      own cognitive fingerprint.
  stage: observe
  source_hash: 32174efd08d2
cognitive-operations:
  description: Applies the Lenses/Operations/Recipes structured-thinking system to complex
    problems and decisions; use for "think through", "what am I missing", "run a pre-mortem",
    "use mental models".
  summary: 'Structured-thinking system that applies Lenses, Operations and Recipes to a complex
    problem, decision or stuck situation. Lenses direct attention (Pareto, second-order effects,
    Goodhart). Nine Operations transform observations: analogical reasoning, abduction, counterfactual
    analysis, falsification, Bayesian updating, first principles, dialectical synthesis, systems
    thinking, perspective simulation. Forty Recipes chain operations through lenses for problem
    types, routed by how the user is stuck (can''t choose, create, diagnose, predict, persuade,
    understand, execute, align, grow, change the system). Input: the user''s problem or decision
    in plain words; for signature analysis, their message history. Produces a named, step-by-step
    reasoning trace, with the operation, move and lens declared at each step. Four modes:
    recipe execution (default), cognitive signature analysis (their default operations and
    blind spots), direct operation (for example a pre-mortem or steelman), and a four-output
    comparison of the natural answer against the recipe-enhanced answer. Reads references/recipes.md,
    operations.md and lenses.md before executing. Principles: diagnose the type of stuck first,
    stop when genuinely surprised, match depth to stakes so simple questions get one operation.
    It does not write files, edit drafts, or record the user''s profile. Stage: analysis and
    decision support, usable at any point in a project.'
  requests:
  - help me think through whether to pivot or stay the course
  - what am I missing in this plan
  - run a pre-mortem on this launch
  - use mental models on this decision
  - steelman the other side of this argument for me
  - I've been stuck on this for weeks, find the real problem
  - what are my cognitive blind spots based on how I framed this
  not_for:
  - cognitive-mirror: wins when the user wants their own thinking patterns recorded into their
      profile over time.
  - audit-fix: wins when an existing plan or change needs an adversarial six-lens audit with
      root-cause fixes applied.
  - grill: wins when the user wants to be interviewed one question at a time to converge on
      a decision or spec.
  - paradigm-collision-engine: wins when the user wants a non-obvious angle generated by colliding
      hundreds of disciplinary paradigms.
  - deep-field: wins when the aim is frontier-quality insight beyond default reasoning via
      Eigenthinking plus latent-space traversal.
  stage: analyze
  source_hash: d057fbc71e65
conversation-consolidation-system:
  description: Builds a four-stage pipeline turning scattered Claude chat history into a searchable
    Obsidian external brain; use for "I can't find what I discussed with Claude", "second
    brain for my AI work".
  summary: 'Builds a four-stage pipeline that turns scattered Claude chat history into a searchable
    Obsidian "external brain". Inputs: the user''s full Claude conversation export (JSON or
    text), manually copied content from Claude Projects (which are invisible to top-level
    export and search), a dedicated Obsidian vault, an Obsidian MCP server, and a scheduler
    (cron, Task Scheduler or an agent scheduler). Steps: export history, run an AI pass that
    groups conversations by topic rather than date, collapse each topic group into one markdown
    document with H2 sections preserving decisions, examples and open questions, then sync
    documents into the vault via the MCP using topics/, daily/, projects-export/ and inbox/
    folders. Adds two scheduled prompts: an 8 PM day-in-review (decided, learned, still open)
    and an 8 AM morning briefing. Output: a vault of roughly 20 to 80 topic documents plus
    daily notes, queryable from Claude. Variants: Tana or Roam as the sync target, a lighter
    export-and-collapse-only first version, and a periodic Project-extraction workaround.
    Gaps are open: no named Obsidian MCP, reconstructed prompts, unspecified merge behavior
    on re-runs. Does not extract named frameworks or publishable IP, and does not archive
    a single session. Stage: setup of a personal knowledge-management layer, upstream of conversation-ip-extractor
    and republishing.'
  requests:
  - I can't find what I discussed with Claude last month
  - build me a second brain from my Claude chat history
  - get my Claude Projects content searchable
  - consolidate my conversations into Obsidian
  - set up a daily review and morning briefing from my AI chats
  - five chats about the same topic should become one document
  not_for:
  - conversation-ip-extractor: wins when one long conversation should yield a named framework
      or publishable IP rather than a searchable archive.
  - capture-chat: wins when exporting or saving a single conversation or session as markdown.
  - knowledge-base-architect: wins when designing an AI knowledge base to query from accumulated
      expertise assets, not chat logs.
  - graphify: wins when turning an existing folder of files into a queryable knowledge graph.
  - wrap: wins when closing out the current session with commit, export and handoff.
  stage: setup
  source_hash: 36b16fa83766
conversation-ip-extractor:
  description: Extracts named frameworks, methodologies, and publishable IP from a long conversation
    or session transcript; use for "what did I figure out here", "find the framework in this".
  summary: 'Reverse-engineers the implicit methodology in a long working conversation and
    packages it as named, publishable IP (the UP=IP principle). Input: a conversation or session
    transcript, ideally 20,000 characters or more (optimal 50,000+), with the practitioner
    making distinct moves, applying criteria, reframing and pushing back; plus intake answers
    on goal, field, intended use (personal, publication, teachable skill) and any existing
    name. Process: read the practitioner''s messages first for sequence of moves, question
    types, accept/reject criteria, reframes and enforced standards; extract 5 to 12 named,
    ordered, generalized steps; run a generalization test with the user; propose 5 to 8 candidate
    framework names (acronym, metaphor, proper noun, principle, question form); check distinctiveness
    against the closest known framework; then package. Output: always a one-page framework
    summary (name, premise, steps, domain of applicability); optionally an article brief (thesis,
    tension, walkthrough, example) or a SKILL.md draft for repeatable processes. Includes
    a Fast Track prompt giving a 3 to 5 sentence methodology description, five names and a
    150-word brief in minutes. Weak on short Q&A sessions or ones where the AI did the work.
    Does not archive chats, build search systems, or profile the user''s cognition. Stage:
    IP extraction after a working session, upstream of drafting articles or creating skills.'
  requests:
  - what did I figure out in this session
  - find the framework in this conversation
  - turn this working session into a named methodology I can publish
  - I've been using this approach intuitively, help me name and formalize it
  - give me a quick framework name and 150-word brief from this chat
  - turn this transcript into a SKILL.md for the process I just did
  not_for:
  - eigenthinking: wins when the user wants the nine-step interview process to turn tacit
      expertise into IP without a transcript.
  - teaching-block-synthesized: wins when the output should be a publishable article narrating
      the session with prompts, outputs and wrong turns.
  - extract-codify-patterns: wins when packaging the session into a shareable bundle with
      README, brief and chat export.
  - cognitive-mirror: wins when the goal is updating the user's personal cognitive profile,
      not a publishable framework.
  - transcript-to-content-pipeline: wins when the user wants articles, LinkedIn variants and
      an audio script from a transcript.
  stage: extract
  source_hash: e4f3098076ad
capture-chat:
  description: Exports and archives a chat conversation or session as portable markdown —
    conversation only, or with the artifacts the session produced; use for "export this conversation",
    "capture this chat", "save this session", "export with artifacts". Defaults to the cross-harness
    .aai session archive; redirectable to any path.
  summary: 'Exports a chat session as portable markdown for archiving or vault ingest, using
    the canonical export-conversation.py script. It reads the session JSONL from Claude Code,
    Codex or Cowork, keeping external human turns and assistant text blocks on the main thread
    and skipping tool calls, thinking and sidechains. Two modes: capture produces a single
    dated .md of the conversation only (YYYY-MM-DD-conversation-export.md); export adds --artifacts
    and produces a folder with conversation.md plus an artifacts/ subdirectory holding copies
    of every file the session wrote that still exists on disk. When in doubt it picks capture.
    Inputs are the mode, an optional explicit JSONL path, and a destination. The default destination
    is the cross-harness archive ~/.aai/projects/<slug>/sessions/ (slug from the repo or the
    projects index, _general for non-project chats); alternatives are a vault inbox/ for ingest
    or any custom path, and it asks via AskUserQuestion when the destination is ambiguous
    or a vault command invoked it. Gotcha: without an explicit JSONL path the script picks
    the most recently modified session log, which can be the wrong session when several are
    open, so pass the path when in doubt. It does not summarize or teach from the session,
    only archives it. The skill also documents how the script is versioned and propagated
    to vault scaffolds. Stage: capture, an archival step at or after session end.'
  requests:
  - export this conversation
  - capture this chat to my vault inbox
  - save this session with the artifacts it produced
  - export the conversation to my Desktop
  - save the conversation as markdown so I can ingest it later
  - archive this session under the project's sessions folder
  not_for:
  - wrap: wins when the user wants the full close-out ritual with commit, teaching narrative,
      handoff and memory harvest, not just an export.
  - checkpoint: wins when the goal is preserving context before /compact or handing off to
      another session, not an archive file.
  - conversation-ip-extractor: wins when the goal is extracting intellectual property or insights
      from the conversation rather than saving it verbatim.
  - conversation-consolidation-system: wins when merging or consolidating many conversations
      into one body of knowledge.
  stage: capture
  source_hash: b05a533d62a0
chat-n-build:
  description: 'Runs a live local dashboard you drive by talking to the agent: it keeps a
    process''s state on screen, answers buttons, adds widgets on demand, and skillifies the
    process; use for "fire up a dashboard for my X", "show this on the dashboard", "turn this
    process into a skill".'
  summary: 'Runs a live local dashboard that the user drives by talking to the agent, which
    acts as the dashboard''s backend. A page polls state.json every second; the agent changes
    state only through the dash.py CLI (init, serve, get, set, patch, apply, move, view, log,
    undo, rm, events, begin, ack, errors, status), never by hand-editing state.json, events.jsonl
    or the HTML, because dash validates, locks, snapshots and writes atomically. Every turn
    starts with dash events: pending button clicks are begun, handled and acked; interrupted
    ones (begun, never acked) are never replayed automatically, the agent inspects what partly
    happened and asks whether to redo, ack as done or ack as failed. Per-dashboard process.md
    rules override defaults and is updated when the user changes the process by talking. Widgets
    include metric, table, list, note, chart, group and custom widgets/<type>.js types, with
    action buttons whose say text becomes the next event. Destructive removals need a highlight,
    a stated plan and a yes before --yes. The platform files (dash.py, renderer.html, server)
    are off limits unless told to build. Fire up creates a dashboard, starts the server and
    shows the URL; a process can also be skillified into a reusable skill. Stage: operate,
    a persistent interactive session.'
  requests:
  - fire up a dashboard for my article pipeline
  - show this on the dashboard
  - add a table widget with the open review items
  - put an approve button on the outline stage
  - turn this process into a skill
  - add a fact-check stage to the pipeline on the dashboard
  - what's on my dashboard right now?
  not_for:
  - token-activity-graph: wins when the user wants a one-off static HTML graph of token usage
      rather than a live interactive dashboard.
  - vibe: wins for a test-first build loop on a local web app or CLI rather than a process-tracking
      dashboard.
  - harness-prd: wins when the need is to interview and design a stateful agent ProcessSpec
      before any dashboard exists.
  - project-index: wins for a one-time searchable inventory of folders and their status.
  - session: wins when tracking project status through the .context/ store rather than a live
      page.
  stage: operate
  source_hash: 92d46e305fd3
deep-comprehension-assessment:
  description: Builds rigorous text-comprehension assessments with detailed feedback; use
    for "test my understanding of this text", "comprehension quiz".
  summary: 'Assessment generator and grader that tests whether a reader truly understands
    a text. Input: the text or material (technical, academic, analytical), then later the
    user''s written answers. Phase 1 analyzes key concepts, mechanisms, findings and implications
    and generates 8 to 10 open-ended questions that cannot be answered by recall, spread across
    nine cognitive levels: conceptual distinction, mechanism analysis, cross-domain analysis,
    behavioral transfer, problem identification, systemic implications, solutions and future
    directions, critical synthesis, personal application. It presents instructions and the
    scoring rubric. Phase 2 scores each answer on four weighted dimensions: factual accuracy
    30 percent, depth of understanding 25 percent, critical analysis and synthesis 25 percent,
    application and insight 20 percent. Phase 3 gives gap-revealing feedback per answer: strengths,
    critical gaps (including invented claims), the exact text passage missing, a weak-versus-exemplary
    comparison, and a named underlying comprehension gap, followed by systematic patterns
    across answers and an improvement path. Also usable by teachers or managers building assessments
    from required reading. Produces a question set, then scored feedback. Does not summarize
    the text, tutor from scratch, or build quizzes with multiple choice recall. Stage: learning
    and evaluation, run after the user has read the material.'
  requests:
  - test my understanding of this text
  - give me a comprehension quiz on this chapter
  - I just read this paper, quiz me and tell me what I missed
  - build an assessment for my team on this required reading
  - grade my answers and show me where my understanding is shallow
  - help me prepare for a discussion of this article by questioning me
  not_for:
  - grill: wins when the user wants to be interviewed to converge on a decision or spec rather
      than tested on a text.
  - ireport: wins when the user wants a research report or summary document of a topic.
  - cognitive-operations: wins when applying thinking frameworks to the user's own problem
      instead of testing reading comprehension.
  - fresh-eyes: wins when validating whether docs or onboarding work by walking a zero-context
      agent through them.
  stage: assess
  source_hash: cd8b22a68255
deep-mirror:
  description: Lifecycle operator for the cognitive-mirror database (not the live extractor)
    — bootstrap deep-mine of raw agent session logs, weekly Mine/Harvest maintenance, quarterly
    blind audit; use for "bootstrap the mirror", "deep mine my session logs", "audit the mirror",
    "mirror status", "is my profile still accurate". Prefer over cognitive-mirror when maintaining/auditing/bulk-mining
    logs rather than extracting from the current conversation.
  summary: 'Lifecycle manager for the cognitive-mirror database (profile, directives, harvest
    store) kept in ~/.aai. Three cadences. Bootstrap, once: inventory raw agent session archives
    (Claude Code JSONL, history.jsonl, Codex, opencode, extended-memory mirror), present table
    and plan, wait for the user''s go, then dispatch cheap-model subagents in parallel batches
    of about 25 files (cap about 200 files) to return dated verbatim receipts in six categories
    (recurring themes, abandonment graveyard, corrections, repetition tax, rhythm, blind spots)
    into deep-mine-evidence.md; only then diff against the profile. Weekly: thin dispatcher
    that runs cognitive-mirror Mine plus Harvest, with Haiku for decision instances and one
    blind Opus pass for patterns. Quarterly audit: blind incremental re-mine of files newer
    than last_mined_mtime, without reading the profile, then classify as validated, drift
    or anchoring suspect and record validation rate in a state file. Status mode reports what
    is due from deep-mirror-state.json. Rules: raw logs never enter main context, patterns
    need 3+ dated occurrences, absence is data, never quote secrets, never write profile or
    directive modules or CLAUDE.md without showing a diff and approval. Produces evidence
    files, state updates, audit reports and proposed diffs. Stage: maintenance and audit,
    downstream of cognitive-mirror.'
  requests:
  - bootstrap the mirror
  - deep mine my session logs
  - audit the mirror
  - mirror status, what's due
  - is my cognitive profile still accurate
  - run the weekly mirror maintenance
  - run the full excavation of my agent history
  not_for:
  - cognitive-mirror: wins for /loms on the current chat, a quick Mine of recent conversations,
      a profile Query, or a Harvest run.
  - conversation-consolidation-system: wins when the goal is a searchable Obsidian brain from
      chat history, not profile maintenance.
  - capture-chat: wins when simply exporting a conversation to markdown.
  - skill-auditor: wins when auditing a skill's files against the library schema rather than
      auditing the cognitive profile.
  stage: audit
  source_hash: b060d64fe60a
deep-field:
  description: Integrated insight system combining Eigenthinking, latent-space cartography,
    and wisdom-of-crowds validation; use for "run deep field", frontier-quality insight beyond
    default reasoning.
  summary: 'Integrated insight system for knowledge entrepreneurs that combines three disciplines
    in a fixed order to produce non-modal intelligence, meaning insight beyond the default
    AI answer that competitors also receive. Eigenthinking comes first and finds the user''s
    cognitive axes (nine steps: signal, drill, reframe, name, build, stress test, compress,
    lift, teach). Latent Space Cartography second traverses the model''s probability landscape
    along those axes in six phases: terrain scan, divergence, boundary probe, shadow harvest,
    faction analysis, synthesis, with a Delta Report recording what was chosen against. Wisdom
    of Crowds supplies the validation logic: the model''s non-modal regions reflect real dissent
    in distributed human knowledge, not hallucination. The unifying move is accessing the
    full distribution at three scales: self, model, crowd. Named outputs: Deep Field (the
    practice), Deep Field Intelligence (structurally uncomfortable, carrying the practitioner''s
    fingerprints, non-replicable without the navigator) and Deep Field Navigator (the trained
    practitioner, via calibration, traversal and synthesis). Input: a complex question plus
    the practitioner''s own expertise. Mostly conceptual and positioning doctrine; it frames
    the method and origin story (Hubble Deep Field) more than it scripts step prompts. Stage:
    deep insight generation, wrapping eigenthinking and latent-cartographer, used before drafting
    or advising.'
  requests:
  - run deep field on this question
  - I want frontier-quality insight, not the median AI answer
  - combine eigenthinking and the latent cartographer for this problem
  - how do I stop giving clients the same answer ChatGPT gives them
  - explain the Deep Field Navigator practice
  - find the non-modal angle on this topic using my own thinking axes
  not_for:
  - eigenthinking: wins when the user only wants the nine-step process to turn their tacit
      expertise into branded IP.
  - latent-cartographer: wins when the user wants just the multi-phase latent-space traversal
      (/lsc) without the self-discovery layer.
  - paradigm-collision-engine: wins when a fresh angle should come from colliding 400+ disciplinary
      paradigms via sub-agents.
  - conversation-ip-extractor: wins when extracting a framework from an existing transcript,
      the operational workflow rather than theory.
  - cognitive-operations: wins when a structured recipe of lenses and operations should be
      applied to a specific decision.
  stage: ideate
  source_hash: 2a0e5444f502
eigenthinking:
  description: Nine-step framework turning tacit expertise into branded, publishable IP (UP
    to IP); use for "turn how I think into a framework", "package my methodology", "make my
    process teachable".
  summary: 'Nine-step guided protocol that turns an expert''s tacit way of thinking into named,
    ownable intellectual property (UP to IP, Unique Process to IP). Steps in order: SIGNAL
    (friction statement), DRILL (structural mechanism), REFRAME (one-sentence lens), NAME
    (curiosity-gap name), BUILD (sequenced methodology with quality gates), STRESS TEST (honesty
    gap and guardrails), COMPRESS (one sentence plus one paragraph), LIFT (the principle one
    level up), TEACH (finished artifact). Inputs: the user''s own expertise and friction,
    optionally pre-work or prior sessions. It first searches the working directory for eigenthinking-log-*.md,
    asks a triage question and session goal, runs an entry-point assessment so confirmed steps
    are verified rather than re-extracted, and keeps a running working-document log written
    after each confirmation. Stance is diagnostic, not validating: it offers two or three
    alternative mechanisms, produces candidates, applies a friend test, and holds confirmed
    positions unless a named trigger reopens them. Output: a named concept, structured methodology,
    compression, lift and a teaching artifact (article, SOP, framework document or skill),
    with the log doubling as the IP extraction report. AI is the capture mechanism, never
    the source of insight. Stage: framework creation, early through production.'
  requests:
  - Turn how I think into a framework
  - Package my methodology so I can teach it
  - Help me name and own my process
  - I keep doing this thing with clients, make it teachable IP
  - Run Eigenthinking on my approach to leadership coaching
  - Continue my eigenthinking log from last session
  - Make my expertise into something I can publish and license
  not_for:
  - conversation-ip-extractor: the user already has a long transcript and wants named frameworks
      mined out of it, not a live guided extraction.
  - cognitive-mirror: the goal is modelling how the user thinks and decides for the agent's
      profile, not packaging IP for an audience.
  - irreplaceable-edge: the user wants to discover a competitive moat against AI, not formalize
      a methodology.
  - geo-authority-architect: the user already has expertise and wants a Canon, Frameworks
      and Diagnostics content architecture for AI citation.
  - hot-take-forge: the user has one contrarian claim to stress-test rather than a whole methodology
      to build.
  stage: framework
  source_hash: 49a468fe00cd
enrich-prompt:
  description: Rewrites and augments a prompt to surface implicit constraints and blind spots,
    then answers the enriched version; use for "make this prompt better", "I keep getting
    shallow answers".
  summary: 'Prompt enrichment skill that rewrites a user''s prompt before answering it, so
    the answer is conditioned on goals, constraints and context the user did not think to
    state. Input: any prompt the user is about to ask or has asked and been disappointed by.
    Process, in order: silently infer the real intent behind the question; map implicit constraints
    (physical, temporal, domain rules, stakeholder context, assumption traps); run a source
    check, asking the user for specific real artifacts (intake form, pricing page, call notes)
    because user data beats model guesses; augment with domain knowledge and scope calibration;
    rewrite so it starts with the real goal, makes constraints explicit, separates user-provided
    from inferred context and keeps the user''s voice. Three modes: default (show the enriched
    prompt, wait for approval, then answer), fast ("just answer", skipping the preview but
    never the source check), and export (deliver a clean copy-paste prompt for another tool,
    no answer). Presents what it noticed, what it used, the enriched prompt, and what changes.
    Refuses to enrich trivial prompts or already rich ones, where enrichment would only add
    words. Stage: pre-answer prompt refinement, usable at the start of any task.'
  requests:
  - Make this prompt better
  - I keep getting shallow answers from Claude, fix my prompt
  - Rewrite this prompt so I can paste it into ChatGPT
  - What am I missing in this question before you answer it?
  - Enrich this prompt and then answer it
  - Just answer this, but surface what I forgot to say
  - Improve my prompt for a client proposal
  not_for:
  - grill: the user wants to be interviewed one question at a time to converge on a decision
      or spec, not have a prompt rewritten.
  - cognitive-operations: the user wants structured thinking tools such as pre-mortems or
      mental models applied to a problem.
  - latent-cartographer: the user wants a multi-phase traversal that avoids the median answer,
      not a prompt rewrite.
  - aimm-commands: the user names a specific AIMM command to run, such as the blind-spot scanner.
  stage: refine
  source_hash: b1f15266e76f
extract-codify-patterns:
  description: Packages a working session into a shareable look-over-my-shoulder artifact
    bundle; use for "package this session", "codify this session", "turn this conversation
    into a teaching resource".
  summary: 'Packages a finished working session into a shareable look-over-my-shoulder bundle
    for the AIMM community, preserving the real working process (prompts, wrong turns, the
    inflection point) rather than only conclusions. Input: the session itself or its chat
    export, plus intake answers on title, core question, the unexpected discovery, target
    reader and what the session produced (when run by the AI that took part, it answers intake
    from its own context). Output: a folder look-over-my-shoulder/<session-slug>/ containing
    README.md with 5 minute, 15 minute and 1 hour reading paths; chat-export/<date>-conversation-export.md,
    unedited; brief/Brief - <title>.md in the standard AIMM brief format; teaching-block/<slug>.md,
    a 1,000 to 2,000 word first-person narrated show-and-tell; a self-contained <slug>.html
    with inline SVGs and CSS; descriptively named SVG diagrams; vault-artifacts/ for rule
    files or promoted and demoted assets; skills/<name>/SKILL.md if a skill emerged. Sequence:
    classify outputs and declare the plan for correction, brief, teaching block, SVGs, HTML,
    vault artifacts, README last. Refuses to write the teaching block as a summary, skip the
    brief, drop the chat export, make generic diagrams, or classify everything as a skill.
    Stage: publish packaging after a session.'
  requests:
  - Package this session as a look-over-my-shoulder bundle
  - Codify this session so the community can learn from it
  - Turn this conversation into a teaching resource with the chat export
  - Extract the patterns from what we just built and make the brief, HTML and README
  - Create a session folder with teaching block, diagrams and vault artifacts
  - Make a shareable walkthrough of how I got to this framework
  not_for:
  - teaching-block-synthesized: the user wants only one publishable teaching-block article
      from the session, not the full bundle with README, brief, export and vault artifacts.
  - capture-chat: the user just wants the conversation exported or archived as markdown, with
      no teaching narrative.
  - conversation-ip-extractor: the user wants named frameworks and publishable IP mined from
      a transcript, not a session bundle.
  - wrap: the user wants the full session close-out ritual with commit, handoff and memory
      harvest.
  stage: package
  source_hash: e8bda54370b1
fresh-eyes:
  description: Validates docs/onboarding/workflows by spawning a zero-context agent to walk
    through them cold, then fix-and-respawn; use for "fresh eyes", "does the onboarding work",
    "test the docs".
  summary: 'Cold-start persona walkthrough validator for docs, install flows, onboarding and
    user journeys. Premise: the only trustworthy evidence that something works is a stranger
    with no builder context doing it. Input: a persona (default a motivated non-technical
    user on a fresh computer), an entry point (README, install doc, URL or first command)
    and a done state (app running, first output produced, email sent), inferred from context
    where possible. Process: spawn a fresh general-purpose Agent walker whose brief says it
    has never seen the project, must execute each step for real rather than reason about it,
    must follow instructions literally without engineering rescue, and must keep a hiccup
    ledger (step, expected, actual verbatim, severity BLOCKER, FRICTION or COSMETIC). The
    orchestrator never walks it itself and never reuses a walker via SendMessage. Triage the
    ledger, fix at root cause (grep everywhere, add prerequisites where all users pass, no
    caveat patches), then respawn a new walker, up to 5 rounds or until zero blockers and
    friction. Output: report of rounds and hiccup trajectory (for example 7 to 3 to 0), the
    clean journey, root-cause fixes per round, leftover items, and a design flag if round
    5 still fails. Stage: audit of onboarding and docs, repeated until clean.'
  requests:
  - Fresh eyes on the onboarding
  - Does my install doc actually work for a beginner?
  - Test the README by having someone walk through it cold
  - Walk through the setup like a non-technical user and fix what breaks
  - Run a cold-start test on this workflow until it is clean
  - Check whether anyone could follow these docs without me
  not_for:
  - gauntlet: the work needs explicit criteria, specialist critics and evidence ledgers for
      a broad deliverable, not a naive walkthrough.
  - audit-fix: the user wants an adversarial lens audit of a plan or change, not an executed
      stranger walkthrough.
  - skill-evals: the user wants to run a skill's existing evals/evals.json and get PASS or
      FAIL.
  - skill-auditor: the user wants a skill checked against the library schema, not a user journey
      tested.
  stage: audit
  source_hash: eb4e0af04f06
geo-authority-architect:
  description: Builds a GEO/AI-citation authority strategy and Canon/Frameworks/Diagnostics
    content architecture; use for "GEO strategy", "get cited by AI", "GEARS".
  summary: 'Guided strategic conversation that builds the upstream architecture for Generative
    Engine Optimization authority, so AI engines such as ChatGPT, Claude and Perplexity cite
    a practitioner''s name and frameworks. Core finding: engines reward coherent, named thinking
    expressed repeatedly, not viral or merely optimized posts. Frame: authority as a tree,
    with Canon as trunk, named Frameworks as branches, content as leaves. Input: the practitioner''s
    own expertise, talked through over 3 to 6 hours across sessions; an existing aimm:canon-lock
    output lets it start at Phase 2. Six phases, each producing a standalone output: Canon
    extraction (3 to 7 reputation-staking statements, with pushback on opinions and tactics),
    Framework Registry (named, repeatable approaches, naming unnamed ones as IP crystallization),
    Diagnostic identification (5 to 10 question self-assessments with a central question),
    Symptom Vocabulary Map with coverage gaps, Content Topology (canonical, diagnostic, symptom
    and evolution assets with target queries, priorities and a 24 week plan), and a one-page
    GEO Authority Blueprint ready for GEARS schema hand-off. It does not audit pages, generate
    schema or monitor GEO, define Canon in a single step, or deep-dive symptom vocabulary.
    Stage: strategy, before publishing and schema deployment.'
  requests:
  - Build my GEO strategy
  - How do I get cited by AI engines like ChatGPT and Perplexity?
  - Help me define my Canon, frameworks and diagnostics
  - Design a content architecture so AI recommends my methodology
  - Give me a 24 week publishing plan for GEO authority
  - I want a GEO authority blueprint before we set up GEARS
  not_for:
  - aimm-commands: the user wants one named AIMM command such as canon-lock, symptom-layer
      or geo-page-audit run on its own.
  - eigenthinking: the user wants to extract and name one methodology from their thinking,
      without the GEO content architecture.
  - irreplaceable-edge: the user wants to find their competitive edge against AI competitors,
      not an AI-citation content plan.
  - knowledge-base-architect: the user wants a private AI knowledge base built from their
      material, not public AI-citation authority.
  stage: strategy
  source_hash: 9dc1bfdbf3c9
grill:
  description: Converges on a decision or spec via one high-leverage question at a time with
    a decisions ledger, then executes; use for "grill me", "interview me", "ask me questions
    one at a time".
  summary: Serial interview that converges a vague request, decision or spec into locked decisions,
    then switches to autonomous execution. Input is any ambiguous task or situation. It privately
    maps unknowns and ranks them by how much each answer changes what gets built (architecture
    forks, then scope, then quality bar, then preferences), discarding curiosity-only gaps.
    It then asks exactly one question per turn, each with a one-sentence why-it-matters and
    a recommended default with the tradeoff named, so a busy user can answer yes. After each
    answer it restates a one-line Locked decision and re-ranks the remaining gaps. Locked
    answers are never reopened unless new information invalidates them. If destructive or
    irreversible operations are in scope, the risk posture (originals preserved, dry-run first)
    is asked first. It stops when no remaining unknown would change the next action, not when
    everything is known, and a request like ask me three questions is honoured. It declares
    Aligned with the constraints as an explicit contract, writes decisions.md (Locked, Constraints
    and risk posture, Out of scope, Open) or appends to the project's .context or spec doc,
    and then executes without further should-I questions. It refuses to batch questions or
    re-litigate. Stage is plan, upstream of building.
  requests:
  - grill me
  - interview me before you start
  - ask me questions one at a time
  - ask me three questions to make sure we're on the same page, then proceed
  - help me decide between these two approaches
  - I have a vague idea for a tool, pin it down with me
  - get aligned with me and then just run with it
  not_for:
  - grill-with-prototype: wins only when the user explicitly asks for a prototype, mockup,
      clickable demo or wireframes while specifying an app, ending in SPEC.md.
  - harness-prd: wins when the interview target is a stateful agent process (state machine
      of agents, gates, artifacts) and the output is a ProcessSpec.
  - hot-take-forge: wins when the thing being hardened is a contrarian argument or claim rather
      than a decision or spec.
  - enrich-prompt: wins when the user wants a prompt rewritten and answered directly instead
      of being interviewed.
  - irreplaceable-edge: wins when the open-ended conversation is about the user's competitive
      moat against AI.
  stage: plan
  source_hash: 39a038d55829
grill-with-prototype:
  description: Builds a clickable prototype of an app's screens live in a local dashboard
    while interviewing for requirements, ending in a SPEC.md; use only when the user asks
    for a prototype, mockup, clickable demo or wireframes. Without that ask, "grill me"/"interview
    me" — even about building an app — is grill.
  summary: Runs a requirements interview for a new app while a clickable prototype of its
    screens re-renders live in a local dashboard, ending in a factory-ready SPEC.md. Use only
    when the user asks for a prototype, mockup, clickable demo or wireframes. Needs Python
    3.10+ and a workspace folder; boot checks dependencies, serves the bridge dashboard, detects
    available models and pushes status. Each turn begins by draining dashboard events (button
    presses, form answers, clicks on prototype controls), then acts, then publishes status
    and pages. The agent keeps a spec.json, theme.json and ledger.json per product slug, and
    a script renders them into HTML screens with Desktop and Phone views, per-screen variants
    the owner flips between, and simulate blocks for failure scenarios. Phases run Frame,
    Shape, Grill, Contract, PRD. Clicking an unspecified control jumps that question to the
    top. Answers become locked decisions and REQ-### requirements with actor, trigger, result,
    evidence, failure behaviour and priority. Up to three questions go in chat, more go in
    a dashboard form. The prd command writes SPEC.md in init-dev-project's format with TODO
    lines for anything unsettled, so make spec fails until resolved, and it will not overwrite
    a hand-written SPEC.md. Commands include status, open, models, ledger, sync, next, phase,
    prd. Stage is plan, upstream of a software factory build.
  requests:
  - grill me on this app idea and show me a clickable prototype as we go
  - mock up the screens while you interview me
  - I want wireframes of my product that I can click through
  - build a clickable demo of the dashboard and write the spec from it
  - prototype this app live so I can react to it
  - new Invoice Tracker --from admin
  - turn our conversation into a SPEC.md with screens and requirements
  not_for:
  - grill: wins when the user says grill me or interview me, even about building an app, without
      asking for a prototype, mockup or clickable demo.
  - harness-prd: wins when the product is an agent process or state machine rather than screens
      a human clicks.
  - init-dev-project: wins when the user just wants the folder scaffolded into the dev standard
      with no interview or prototype.
  - vibe: wins when the user wants a running build loop that changes a local app and shows
      results, not a requirements interview.
  - to-issues: wins when a finished spec or PRD already exists and needs breaking into issues.
  stage: plan
  source_hash: f6f996142f54
hot-take-forge:
  description: Hardens a contrarian claim by forcing it to survive repeated self-attack until
    it is simultaneously novel AND true; use for "give me a hot take on X", "pressure test
    this take", "is this angle actually original".
  summary: 'Hardens one contrarian claim until it is both novel and true, by attacking it
    repeatedly yourself. Input is a topic or a catchy candidate take, plus optionally a draft.
    The skill supplies its own skeptical adversary and runs nine ordered tests. First it overshoots
    on surprise to get a hot draft. Then the Decomposition Test splits it into falsifiable
    sub-claims C1 to Cn. The Tautology Tell checks whether every objection collapses to cheap
    X is commoditized, which signals an over-claim. The Prescription-Completeness Test pushes
    the diagnosis deeper until the cause implies the fix. The Caveat-Fold verifies empirical
    claims against sources and folds contradicting evidence into a stronger argument. The
    Example-Audit catches examples that silently redefine terms. The Scope-Audit checks the
    claim against the audience''s full portfolio. The Legs Rule requires evidence, example
    and test on every prescriptive bullet. The Weakest-Leg Attack plus Moat-Sharpening replaces
    attacked wording with the more precise version that survives. Output is a hardened claim,
    not an article: a one-line thesis, the decomposed sub-claims, each with its strongest
    objection and surviving wording or rejection, and a prescription with legs. The survivor
    is usually narrower and less catchy than the first draft. That artifact feeds writer,
    editor or eigenthinking. It refuses to jump to prose before the claim holds and is skipped
    for settled or purely empirical questions. Stage is research, upstream of drafting.'
  requests:
  - give me a hot take on AI replacing coaches
  - pressure test this take before I publish it
  - is this angle actually original or just the same post with new stickers?
  - I want a contrarian angle that is also true
  - attack my argument until only the defensible part is left
  - everyone is saying X about this topic, find the claim that survives
  not_for:
  - paradigm-collision-engine: wins when the user wants a wide pool of non-obvious candidate
      insights generated, with no truth requirement or single claim to harden.
  - grill: wins when the object of the interview is a decision or spec rather than an argument.
  - gauntlet: wins when a finished deliverable needs criteria-based critique and revision
      loops, not a claim hardened for novelty versus truth.
  - eigenthinking: wins when a hardened claim or expertise is already settled and needs turning
      into a branded named framework.
  - writer: wins when the claim is already firm and the job is drafting the article from a
      brief.
  stage: research
  source_hash: c17dde5ddbbd
ireport:
  description: Generates styled, interactive HTML research reports from a topic or notes;
    use for "interactive report", "HTML report on X", "deep research document".
  summary: 'Generates a styled, interactive single-file HTML research report, invoked as /ireport.
    Input is flexible: a bare topic (full web research), a topic with key questions, a topic
    with URLs or sources to fetch, raw notes (light structuring), or complete content (format
    only). It parses scope, researches as needed with web search and URL fetches, finds citations,
    synthesizes findings into sections, picks 2 to 4 headline statistics for hero cards, pulls
    key insights into callouts and shapes comparison data into tables. The output is built
    from composable primitives in the Kimi Deep Research document style: fixed table-of-contents
    sidebar, hero section with stat cards, executive summary with an insight callout, three
    to seven main sections, and a footer with summary and topic tags. Styling uses Tailwind
    via CDN, Font Awesome, Inter for body, Georgia for display headings, a teal and cyan palette
    on a gray-50 surface, and bento-grid, stat-card and citation-link classes. Citations are
    real links. The file is saved to ./ireport/reports/ with a kebab-case topic name and opened
    in a browser. The final reply gives the file location, key findings and areas where more
    research would help. It produces HTML reports only, not articles, slide decks or Markdown
    dossiers. Stage is publish, the presentation layer for research.'
  requests:
  - /ireport AI agents in enterprise software 2025
  - make an interactive HTML report on the state of vector databases
  - deep research document comparing React, Vue and Svelte for my startup
  - turn these notes and links into a styled report I can open in a browser
  - format this research as a nice HTML report with stat cards and a sidebar
  - give me a shareable web report with citations on this market
  not_for:
  - researcher: wins when the user wants a plain structured research dossier of sources to
      feed a writer, with no HTML styling.
  - writing-team: wins when the deliverable is a publish-ready article or essay, not a visual
      report.
  - project-brief: wins when the user wants a short one-page overview of a project in plain
      text.
  - token-activity-graph: wins when the HTML visual is a chart of the user's own token usage
      by day, app and model.
  - graphify: wins when the subject is a folder or codebase to be mapped as a queryable graph
      rather than a web-researched report.
  stage: publish
  source_hash: 684b6369878d
irreplaceable-edge:
  description: Guided live discovery of a professional's irreplaceable competitive edge against
    AI-first competition; use for "find my edge", "what's my moat", "how do I compete with
    AI".
  summary: 'Guided live conversation that uncovers a professional''s irreplaceable competitive
    edge against AI-first competition. Input is the user themselves: a coach, consultant,
    recruiter or other expert answering in real time; no files are required. It is explicitly
    not a questionnaire. The interviewer keeps a hidden signal map updated after every answer
    (emerging themes, convergence and divergence points, tension threads, energy markers,
    absent signals, a current hypothesis, confidence level) and reflects on it before replying.
    Moves come from a repertoire of seven used in any order: story extraction of concrete
    disaster-saved or judgment-call episodes, pattern surfacing, the Challenge that pressure-tests
    why a model could not replicate the edge in two years, the Inversion that studies failures
    without it, the Time Test that checks the edge appreciates as AI improves, latent space
    exploration using web search for parallel industries and competitor positioning, and Crystallization
    once signal converges. The philosophy is that the real edge lives in stories whose signal
    never entered text, and strategic answers only return a polished commodity layer. Crystallization
    names the edge in the person''s own language, explains why it resists commoditization,
    shows how it compounds, cites their stories as evidence and states what it means for their
    business model. It refuses to rush to a label and rejects generic claims like personalized
    service. Stage is discovery, an early positioning step.'
  requests:
  - find my edge
  - what's my moat against AI?
  - how do I compete with AI-first firms in my industry?
  - help me figure out what makes me irreplaceable
  - interview me about my best client work and tell me what's actually unique
  - AI can do most of what I sell, what can't it do?
  not_for:
  - eigenthinking: wins when the expertise is already known and needs turning into a branded,
      publishable framework through the nine-step UP to IP method.
  - hot-take-forge: wins when the user has a contrarian claim or take to harden for truth
      and originality, not a personal edge to discover.
  - grill: wins when the user wants a generic one-question-at-a-time interview to settle a
      decision or spec.
  - geo-authority-architect: wins when the task is building an AI-citation authority content
      strategy, not discovering the edge.
  - conversation-ip-extractor: wins when named frameworks and IP must be mined from an existing
      long conversation transcript rather than a live interview.
  stage: discovery
  source_hash: 1f690c7da4ee
knowledge-base-architect:
  description: Guides design and deployment of a personal AI knowledge base from accumulated
    expertise assets; use for "talk to my own knowledge", "build a private ChatGPT on my material".
  summary: 'Consultative guide for designing and deploying a personal AI knowledge base from
    a practitioner''s accumulated expertise (frameworks, client cases, articles, coaching
    notes, transcripts scattered across Notion, Drive and email). It runs an eight-question
    intake covering content volume and types, example queries, privacy needs, intended users,
    technical comfort on a 1 to 10 scale, budget, timeline and purpose. A decision tree keyed
    first on privacy and technical capacity, then cost and timeline, selects among five architectures
    with stated trade-offs: local Qdrant plus Open Web UI or LibreChat (maximum privacy, about
    4 to 8 hours setup), Pinecone plus ChatGPT Action (client-facing, low ops), Perplexity
    Spaces (zero setup, low privacy), NotebookLM (demos and audio, not a primary KB), and
    Open Web UI with local models (cheapest, weaker answers). It then picks a minimum viable
    list of 10 to 20 assets to ingest first, prescribes chunking (500 to 800 tokens for transcripts
    and long-form, 200 to 300 for short posts, section-based for structured guides) and a
    tag taxonomy (date, type, topic, framework, audience, plus source and author metadata),
    and finally produces a deployment brief that can be handed to an Upwork or Fiverr freelancer.
    It reframes a website as answering known questions and a KB as answering the next ones.
    Stage is setup, an architecture and procurement step.'
  requests:
  - I want to talk to my own knowledge
  - build a private ChatGPT on my coaching material
  - which stack should I use for a knowledge base of my articles and transcripts?
  - my content is confidential, how do I make it searchable with AI?
  - write a brief I can give a freelancer to set up my knowledge base
  - what should I ingest first and how should I chunk it?
  not_for:
  - graphify: wins when the user wants a queryable graph built from a folder of files right
      now, with no vendor or architecture decision.
  - ambient-folder: wins when the user wants a local folder made agent-aware with identity
      and purpose files rather than a vector-database chatbot.
  - conversation-consolidation-system: wins when the problem is turning scattered Claude chat
      history into a structured archive.
  - voice-profile-trainer: wins when the goal is making AI write in the user's voice from
      samples, not querying their knowledge.
  - extract-codify-patterns: wins when a working session should be packaged as a shareable
      artifact bundle.
  stage: setup
  source_hash: ac42411eecba
latent-cartographer:
  description: Multi-phase latent-space traversal that maps the probability landscape before
    answering; use for "/lsc", "run the cartographer", "don't give me the median answer".
  summary: 'Takes a single prompt or question and runs a six-phase traversal of the model''s
    answer space before committing to a position, so the result is not the modal, median answer.
    Input is just the prompt; invoked via /lsc, /cartograph, /lsc-lite, /lsc-deep, "use the
    cartographer on", or requests for multi-perspective, non-obvious or adversarial analysis.
    Phases: terrain scan (states the modal answer, 4 to 6 variance dimensions, confidence
    topology), divergence (4 mutually incompatible positions, each with a load-bearing assumption
    and a kill condition), boundary probe (pushes each position to its extreme, reads hedges
    as signal), shadow harvest (uncomfortable truth, inversion, outsider signal, temporal
    displacement), faction analysis (dominant, suppressed and absent perspectives, bias vector),
    and convergence. Convergence yields a landscape map, a committed synthesized position,
    residual uncertainty split into reducible, irreducible and frame-dependent, and a Delta
    Report comparing the answer to the modal one. Quality gates check positions are truly
    incompatible, one surprising shadow position exists, an absent faction is named, and the
    final answer differs from the modal answer; failures are flagged, not hidden. Lite mode
    runs phases 1, 2, 6; deep mode iterates phases 3 and 4 on the output. Output is inline
    phase-headed text or a downloadable .md file. It does not research the web, write articles,
    or edit drafts. It is a single-response reasoning method, a middle-stage thinking step
    used before drafting or deciding.'
  requests:
  - /lsc what will happen to mid-market SaaS pricing over the next five years
  - Run the cartographer on this question, I don't want the median answer
  - Explore the landscape of whether we should open-source our core product
  - Give me four genuinely incompatible takes on remote work and then tell me which one you'd
    back
  - /lsc-lite should I raise prices or add a premium tier
  - What would an outsider notice about this market that the experts are blind to?
  - /lsc-deep why do most corporate AI pilots stall
  not_for:
  - deep-field: Wins when the user wants the integrated system that also applies Eigenthinking
      and wisdom-of-crowds validation, not the cartographer alone.
  - paradigm-collision-engine: Wins when the user wants a fresh angle generated by colliding
      hundreds of disciplinary paradigms with parallel sub-agents and a tournament.
  - hot-take-forge: Wins when the user has one contrarian claim and wants it hardened by repeated
      self-attack until it is novel and true.
  - cognitive-operations: Wins for structured thinking with named lenses, pre-mortems and
      mental models on a decision, not latent-space mapping.
  - researcher: Wins when the need is gathered, cited sources in a dossier rather than reasoning
      over the model's own probability landscape.
  stage: reasoning
  source_hash: ce1731e019d6
leaderize-storytelling-framework:
  description: Selects and applies storytelling frameworks for Leaderize's mid-level-leader
    audience across content stages and live sessions; use for Leaderize content or session
    design.
  summary: 'Picks and applies a storytelling framework for Leaderize, a brand serving mid-level
    leaders in functional collapse who want relief rather than inspiration and distrust hype.
    Core principle is forensic empathy over persuasion: every piece should produce a "how
    did you know?" moment. Input is the pain point the content addresses (for example everything
    escalates to me, AI is overwhelming, team is not autonomous, can''t switch off, need proof,
    leadership doesn''t get it) plus whether the output is written content or a live session.
    It maps the pain point to an ICP hidden reality and journey stage, then chooses a framework:
    Nested Transformation Arc for feeling seen, Clarity-Driven ABT for structure and AI explainers,
    Case Study pattern for proof without pressure. For live formats it selects by size and
    interaction: webinar (Transformation Arc then ABT), workshop (ABT then Application), masterclass
    (Arc then Deep Framework), coaching (Socratic ABT), conference talk (Arc then Call to
    Reflect), and loads the matching reference file only when needed. Before finalizing it
    runs an ICP alignment checklist (relief not more work, no shame framing, names the unnamed,
    no hype, Bally/Leaderize as guide not guru) and a 5 Moments check requiring at least two
    moments such as naming the escalation point or calm as success metric. It produces a framework
    choice and structure guidance, not a finished article, and is Leaderize-specific. Stage:
    planning, before drafting content or designing a session.'
  requests:
  - Which storytelling framework should I use for a Leaderize article about leaders who are
    the escalation point for everything?
  - Help me structure a Leaderize webinar for mid-level leaders overwhelmed by AI
  - Design a workshop outline for Leaderize, 15 people, high interaction
  - I need a case study piece for Leaderize that doesn't feel too good to be true
  - Plan a conference talk for Bally's audience using the transformation arc
  - Does this Leaderize email create the how did you know moment?
  - Frame a coaching session for a leader who can't switch off
  not_for:
  - writer: Wins when the framework and brief are already settled and the user just wants
      the first draft produced.
  - brand-writing-team: Wins when the user wants an end-to-end brand post or newsletter drafted
      with intake, not just a framework selection.
  - voice-profile-trainer: Wins when the problem is output not sounding like the user, which
      needs a voice profile derived from writing samples.
  - eigenthinking: Wins when the user wants to turn tacit expertise into a branded methodology
      rather than pick a story structure.
  - editor: Wins when a Leaderize draft already exists and needs surgical tightening instead
      of framework choice.
  stage: plan
  source_hash: 473bbf15ffd0
meeting-nuggets:
  description: Turns meeting transcripts into newsletter-style topic recaps with research
    add-ons and optional Notion publishing; use for "recap this meeting", "session report",
    or any pasted VTT/call transcript.
  summary: 'Converts a meeting or community-call transcript (VTT, plain text, or pasted) into
    a newsletter-style recap that members will actually read, not meeting minutes. Optional
    second input is the session chat export, mined for links, resources and attributions.
    First use runs a conversational interview (group name, audience, cadence, tone from formal
    to casual, output target of markdown or Notion, hub page, recurring segments, title format)
    and stores a config block that later recaps inherit. Output has a pull quote, a "This
    Week/Month in 30 Seconds" bullet summary, 3 to 5 topic sections of 500 to 750 words with
    bolded thesis-style openers, value-add callouts chosen per topic (Hot Take, What This
    Means for You, or researched Go Deeper links found by real web search, never invented
    URLs), a Community Corner spotlighting member wins, a Links Shared in Chat list, a single
    15-minute "Try This Before Next Session" exercise, custom segments, and series navigation
    footers. It can publish to Notion as a subpage under a hub, update the hub and previous
    page''s forward link, and always saves a local markdown copy. Topics are grouped by subject,
    never by speaker order. It refuses to produce chronological "Alice said, then Bob said"
    summaries and skips forced callouts. Stage: transform, after the meeting, before distribution.'
  requests:
  - '''Recap this meeting'' with a pasted Zoom VTT transcript'
  - '''Turn this call transcript into a newsletter for my mastermind group'''
  - '''Write the session report from today''s recording and the chat export'''
  - '''Make a Notion recap page for this week''s community call and link it to the hub'''
  - '''Pull the golden nuggets out of this transcript and add some resources to go deeper'''
  - '''Write up last night''s founders roundtable, smart-casual tone'''
  - '''Here''s the transcript, give me topic sections plus a try-this-before-next-time'''
  not_for:
  - transcript-to-content-pipeline: Wins when the user wants a content package from a transcript
      (article, LinkedIn variants, audio script) rather than a recurring group recap.
  - conversation-ip-extractor: Wins when the goal is pulling named frameworks and publishable
      IP from a transcript, not a member-facing digest.
  - aimm-commands: Wins for named AIMM prompt commands such as transcript-miner run directly
      on input.
  - writing-team: Wins when the user wants a single researched, edited article from an idea,
      not a recap of a meeting.
  - aimm-newsletter: Wins when the recap already exists and the task is emailing it to a contacts
      group.
  stage: transform
  source_hash: 98ec699f1c8a
multi-model-debate-live:
  description: Orchestrates a live human-steered Claude/Gemini/Codex debate against one shared
    markdown file; use for "three-pane terminal", "run the models against each other" — the
    live workflow, not the prompt protocol.
  summary: 'Runs Lou''s live, human-steered multi-model debate: three terminal panes (Ghostty)
    running the claude, gemini and codex CLIs, all reading and writing one shared markdown
    file, with Marked auto-refreshing the rendered view so every contribution is visible as
    it lands. Inputs: an artifact to debate (a skill, spec, system prompt, proposal or framework
    small enough for one file), an absolute path for the shared file, and the three model
    CLIs installed on macOS. Protocol has five steps: create the file and brief; Claude writes
    the initial spec to disk; Gemini reads, critiques and appends attributed additions; Codex
    reads everything and adds technical, structural and measurable corrections; a synthesis
    model (Opus in the demo) reads the whole file, keeps the best of each contribution, cuts
    weak material and explains every keep or cut with model attribution. The conductor pauses
    between every turn to read the file and tailor the next model''s prompt to what is missing
    or doubtful, which is where the quality comes from. Output is one final markdown spec
    plus attributed intermediate states, taking roughly 15 to 30 minutes. Variants: two-model
    lite, a fourth synthesis model, manual browser-tab fallback, extra chain steps. It is
    the live orchestration layer, not the copy-paste deliberation prompt protocol (/multi-model-synthesis),
    and is not for single-extra-opinion needs, long documents, or fire-and-forget runs. Stage:
    deliberation, applied to a spec before finalizing.'
  requests:
  - Set up the three-pane terminal debate with Claude, Gemini and Codex on this spec
  - Run the models against each other on my skill design and I'll steer between turns
  - Let's do the live multi-model debate on a new system prompt
  - Have Gemini and Codex critique what Claude wrote in the shared markdown file, then synthesize
    with Opus
  - I want Marked open and all three CLIs writing to one spec file
  - Do the Lou debate workflow, but with just two models
  - Conduct a live debate across models for my proposal and attribute who contributed what
  not_for:
  - paradigm-collision-engine: Wins when the diversity should come from hundreds of disciplinary
      paradigms run through sub-agents, not from different models.
  - latent-cartographer: Wins when one model should map its own answer space in a single response,
      with no other models or terminal panes.
  - gauntlet: Wins when work should go through explicit criteria and independent critique
      loops inside one harness rather than a hand-steered three-CLI debate.
  - grill: Wins when the user wants to be interviewed one question at a time to converge on
      a decision.
  - fresh-eyes: Wins when a zero-context agent should walk through docs or workflows cold,
      not three models debating a spec.
  stage: deliberate
  source_hash: 9430cefc63c7
paradigm-collision-engine:
  description: Generates non-obvious insight by colliding 400+ disciplinary paradigms via
    parallel sub-agents and an elimination tournament; use for "fresh angle on X", "non-obvious
    take", "multiple lenses".
  summary: 'Generates non-obvious, actionable insight on a topic by colliding 400+ disciplinary
    paradigms, implementing Michael Simmons'' Paradigm Collision framework. Inputs: a single
    sharp topic sentence (vague topics get pushed back on), the audience and what the output
    feeds, and a paradigms.csv (id, name, discipline, tension_axis, core_claim, blind_spot,
    representative_thinkers) stored under wiki/mastermind/skills/paradigm-collision-engine/.
    Requires an environment that can dispatch parallel sub-agents. Workflow: slice the CSV
    into 8 to 12 groups of 30 to 50 paradigms (by discipline cluster or diversity-sliced);
    dispatch one sub-agent per slice to score relevance 0 to 10 and write candidate insights
    for paradigms scoring 6 or higher, targeting a pool of 40+; run a three-round elimination
    tournament (triage, head-to-head, cross-paradigm stress test) on three criteria, counterintuitive,
    changes how you think, actionable; synthesize 5 to 8 survivors with Simmons'' verbatim
    instruction to optimize for wisdom of crowds and hybrid vigor into 1 to 3 insights, each
    naming contributing paradigms and the blind spot exposed. Saves a dated run record with
    pool, bracket and survivors. Takes about an hour minimum. Variants: Hot Take layer for
    session recaps, domain-specific paradigm packs, RAG-backed paradigms, a 10-minute five-paradigm
    micro version. It refuses settled or empirical questions, quick-answer needs, and topics
    too narrow for multiple paradigms. Stage: ideation, before an angle is chosen for writing
    or a decision.'
  requests:
  - Find me a fresh angle on why AI strategy consulting engagements fail
  - Run the paradigm collision on Block's layoffs
  - I need a non-obvious take for a blockbuster article on the AI curator archetype
  - Look at this decision through multiple lenses and tell me what every existing take is
    missing
  - Give me a Hot Take for this mastermind session from colliding paradigms
  - Pressure-test our pricing strategy against a wide spread of disciplinary critiques
  - Do the Simmons hybrid vigor workflow with parallel sub-agents on this topic
  not_for:
  - latent-cartographer: Wins when one prompt needs a fast single-response traversal of the
      model's answer space, not an hour-long multi-agent run.
  - hot-take-forge: Wins when the user already has a contrarian claim to harden by self-attack
      rather than generating angles from paradigms.
  - deep-field: Wins when the user wants the integrated Eigenthinking plus cartography plus
      crowd-validation system.
  - multi-model-debate-live: Wins when the diversity should come from different models debating
      one shared file, not from paradigm lenses.
  - researcher: Wins when the question is empirical or settled and needs sources gathered
      instead of paradigm collision.
  stage: ideate
  source_hash: f62f50058fe0
polyglot-language-coach:
  description: Gently coaches when the user writes in a non-English language mid-conversation
    — corrects, teaches, logs, returns to task; applies whenever the user code-switches as
    practice.
  summary: 'Ambient language coach that activates inside any conversation (coding, writing,
    planning) when the user writes full sentences in a non-English language or code-switches
    in a way that reads like practice. Input is the user''s own non-English sentence; output
    is a short coaching interlude of 5 to 7 sentences: warm acknowledgement naming the language,
    the corrected sentence (plus an optional more idiomatic alternative), exactly one mini-lesson
    explaining the why, then a one-sentence bridge back to the original task, which it continues
    in the same reply. For mostly-target-language sentences with English words mixed in, it
    treats each English word as a vocabulary gap, reconstructs the full target-language sentence
    and lists the fills with gender and register notes. Before correcting, it asks one short
    question whenever the sentence has any plausible ambiguity (missing accents, pronoun-less
    verb forms, homonyms, register), and logs nothing until clarified. Silently appends each
    teaching moment, including Latin or Greek checks and grammar questions, to a daily Obsidian
    note under a configurable vault path with hierarchical tags and reusable concept wikilinks;
    logging failures are swallowed. It refuses to trigger on loanwords, proper nouns, translation
    requests, quoted foreign text, or code comments. It honours "no corrections", "be harder",
    and "stop coaching", checks style every ~5 turns, and asks about staying in practice mode
    after 2 to 3 turns. Stage: ambient, runs alongside other work, not a pipeline step.'
  requests:
  - '''Hoy yo fui al mercado y compré muchos frutas'' typed mid-task as practice'
  - '''voy a upgrade mi template'' (Spanish with English gaps)'
  - '''Je suis fatigué aujourd''hui, let''s just chat in French, no corrections please'''
  - '''Is this Latin sentence correct, and why?'''
  - '''Be harder on me, I want more grammar in the corrections'''
  - '''Stop coaching for now'' / ''start correcting my Japanese again'''
  - '''Ich habe gestern ein Buch gelesen, ist das richtig?'''
  not_for:
  - deep-comprehension-assessment: Wins when the user wants a rigorous comprehension quiz
      on a text, not live correction of their own foreign-language sentences.
  - grill: Wins when the user wants to be interviewed one question at a time on a decision
      or spec.
  - enrich-prompt: Wins when the user wants their English prompt rewritten and improved, not
      their non-English sentences corrected.
  - capture-chat: Wins when the goal is exporting a conversation as markdown rather than logging
      language lessons to Obsidian.
  stage: ambient
  source_hash: f9434b3f9166
transcript-to-content-pipeline:
  description: Turns a raw transcript or session notes into a full content package (article,
    LinkedIn variants, summary, audio script); use for "turn this into content", "write something
    from this transcript".
  summary: 'Seven-stage pipeline that converts a raw transcript or session notes (mastermind
    or coaching call, interview, AI working session, client debrief, chat export) into a complete
    content package with the practitioner acting as editor, not producer. Stage 1 ingests
    the source uncleaned, ideally 2,000+ words. Stage 2 extracts 15 to 25 nuggets using a
    reverse-outline filter (what surprised, what challenged an assumption, what you would
    repeat over coffee), each with a headline and High/Medium/Low signal score. Stage 3 presents
    the top four candidates by novelty, audience relevance, canon alignment and developability
    and waits for confirmation of two to four. Stage 4 writes a creative brief per pick (angle,
    assumption to challenge, structure, research hooks, length) and waits for approval. Stage
    5 drafts through the aimm-writing-team roles, or Researcher, Strategist, Writer, Editor,
    Publisher in sequence. Stage 6 applies a voice-profile pass, flagging when no profile
    exists. Stage 7 delivers a 600 to 1200 word article, three LinkedIn variants (hook, insight,
    story), a 200 to 300 word summary, and an optional 90 to 120 second audio script. It pauses
    at two editorial checkpoints, avoids equal treatment of nuggets, and is weak on short,
    technical or logistics-heavy sources. Stage: draft, an end-to-end package from source
    material.'
  requests:
  - Turn this into content
  - Write something from this transcript
  - Run the content pipeline on this mastermind recording
  - Pull the best ideas out of this coaching call and make LinkedIn posts
  - I have a Zoom transcript, give me an article, summary and audio script
  - Extract the nuggets from this session and tell me which to develop
  not_for:
  - meeting-nuggets: wins when the output should be a newsletter-style topic recap of a meeting
      with research add-ons, not a multi-format content package.
  - writing-team: wins when the user already has the idea and wants research, draft and edit
      to a finished piece, with no transcript mining.
  - conversation-ip-extractor: wins when the goal is only to surface named frameworks and
      publishable IP from a conversation.
  - voice-profile-trainer: wins when the user needs a voice profile built from writing samples
      before any content is run.
  - teaching-block-synthesized: wins when the user wants a first-person process walkthrough
      of a working session instead of a content package.
  stage: draft
  source_hash: 4152628a6908
voice-crm-pipeline:
  description: Builds a hands-free voice-to-database capture chain (Siri to Shortcut to GPT
    to Sheets); use for "I never update my CRM", "talk to my database", "voice-to-sheet workflow".
  summary: 'Build guide for a hands-free voice-to-database capture chain: say a sentence to
    Siri, an iOS Shortcut or Mac AppleScript captures the dictation, a Custom GPT (or Claude
    Project, API endpoint, or local LLM) acts as interpreter and turns free-form speech into
    JSON matching a fixed field schema, and a Google Apps Script web app with doPost() appends
    the row to a Google Sheet that serves as the live database. Source is Don Back''s PowerUp
    AI Mastermind demo of 2026-03-12. Inputs the user must decide or have: an iOS device with
    Siri, optionally a Mac with Shortcuts or Script Editor, a ChatGPT Plus or equivalent LLM,
    a Google account, and a small 4 to 7 column schema (for example timestamp, contact, interaction_type,
    note, next_action, due_date). The workflow runs six steps: lock the schema, build and
    curl-test the Apps Script endpoint, write the single-purpose interpreter prompt that resolves
    relative dates, build the Siri trigger, test end to end with a messy sentence, then tune
    the prompt over 10 to 20 real inputs. Output is a new structured row within seconds and
    no app opened. It generalises to journals, decision logs, commitments, expense and content-idea
    capture. It admits gaps: the original Apps Script, GPT prompt and AppleScript glue were
    never shared, so these are reconstructed scaffolding. It is not a CRM product, not an
    email or Gmail tool, and not a transcript or content processor. Stage: setup, a one-evening
    build.'
  requests:
  - I never update my CRM, can I just talk to it
  - set up a Siri shortcut that logs client notes to a Google Sheet
  - build a voice-to-sheet workflow for my post-meeting download
  - dictate my next actions and have them land in a spreadsheet automatically
  - talk to my database from my phone while I'm driving
  - make a voice decision log or daily reflection capture that stays structured
  - how do I connect Siri to a Custom GPT and Apps Script
  not_for:
  - transcript-to-content-pipeline: wins when the input is an existing raw transcript or session
      notes that must become articles, LinkedIn posts or scripts rather than a live capture
      chain.
  - conversation-ip-extractor: wins when the goal is mining a finished conversation for named
      frameworks and publishable IP, not capturing new voice notes.
  - gmail-manager: wins when the task is searching, sending or labeling email through the
      Gmail MCP rather than logging spoken updates to a sheet.
  - chat-n-build: wins when the user wants a live local dashboard driven by talking to the
      agent instead of a Siri, GPT and Sheets chain.
  stage: setup
  source_hash: 350b75438bbe
voice-profile-trainer:
  description: Derives a reusable voice profile from authentic writing samples so AI output
    sounds like the user; use for "doesn't sound like me", "write in my voice", "set up my
    voice profile".
  summary: 'Derives a reusable, named and versioned Voice Profile from a person''s own writing
    so AI output stops sounding like the statistical average. Inputs: 10 to 12 "genuinely
    me" samples (articles, emails, LinkedIn posts, coaching notes written without heavy AI
    help) and 5 to 10 "edit-away" samples, meaning AI outputs the user significantly corrected,
    ideally original plus edited version, or failing that a description of 3 to 5 recurring
    annoyances. It runs six stages: sample intake; pattern extraction (sentence-length distribution
    and Flesch-Kincaid band, open and close habits, vocabulary register, metaphor types, AI
    telltales such as delve, nuanced, hedging, false balance, preamble); a cognitive fingerprint
    of 2 to 4 non-negotiable patterns taken mostly from the edit-away data, which is treated
    as more diagnostic than approved writing; a style guide document stored as [name]-voice-profile-vX.X.md;
    a seven-item voice authentication checklist where 5 of 7 passing approximates the 70 to
    80 percent threshold; and the final deliverable, a 200 to 400 word system-prompt block
    to prepend to any writing request. It asks the user to confirm the extracted pattern report
    before finalising. It does not draft, edit or publish content itself, and it does not
    invent a voice from a vague description without samples. The included Lou profile is an
    example, not a default. Stage: setup, run once then refresh, ahead of drafting.'
  requests:
  - this AI writing doesn't sound like me
  - build my voice profile from these samples
  - set up a voice profile so ChatGPT or Claude writes in my voice
  - analyze my past posts and tell me what makes my writing mine
  - I keep editing out the same AI-sounding phrases, capture that
  - create a prompt block I can paste before any writing request
  - update my voice profile to v1.1 with these new edits
  not_for:
  - writer: wins when a brief already exists and the user wants a first draft produced, with
      or without a ready voice profile.
  - editor: wins when an existing draft needs tightening or polishing now, rather than extracting
      a reusable voice profile.
  - writing-team: wins when the user wants a whole article taken from idea to publish-ready
      piece.
  - cognitive-mirror: wins when the goal is modeling how the user thinks, decides and evaluates
      from conversations, not how their prose reads.
  - transcript-to-content-pipeline: wins when a raw transcript must be turned into articles
      and social variants, using a profile that already exists.
  stage: setup
  source_hash: 5256bfb0dadc
wrap:
  description: Full session close-out ritual — commit, export conversation, teaching narrative,
    handoff, memory harvest; use for "wrap up", "close out", "export this conversation". For
    a plain .context/ checkpoint, prefer session.
  summary: 'Full session close-out ritual run at the end of a substantial working session
    so value is not lost. It treats a session as producing three products: committed work,
    raw teaching material, and continuity state. Input is the current session plus the project''s
    git state; no other files are required. Six ordered steps, each skippable only with a
    stated reason: (1) land the work with git status and git remote -v, stage specific files,
    commit with a why-message, merge finished branches or worktrees to main, and push only
    when a remote exists and push permission was granted; (2) export the conversation to chat_exports/YYYY-MM-DD-slug-conversation.md;
    (3) write a teaching narrative (need, journey with wrong turns, result, application and
    benefit) with local paths replaced by placeholders; (4) produce a handoff, either via
    the .context/ check-out protocol or an overwritten HANDOFF.md with state, locked decisions,
    ordered next steps, open questions and what not to do, tested by whether a zero-memory
    agent could continue; (5) harvest only what earned permanence, such as a gotcha appended
    to a failed skill, a durable fact saved as memory, or a reusable asset flagged as a promotion
    candidate, where "nothing earned a memory" is a valid outcome; (6) report a checklist
    with clickable paths, skipped steps, and any decision needed from the user. Refuses to
    push without permission, to git add -A, to move instead of copy, or to pad the narrative
    with tool output. Stage: close-out, end of session.'
  requests:
  - wrap up this session
  - close out, commit everything and write the handoff
  - export this conversation and write up what we did
  - I'm done for today, save state so the next agent can pick up
  - wrap it, and tell me if anything earned a memory
  - end of session ritual with a teaching narrative
  not_for:
  - checkpoint: wins when the user only wants to save context before a compact or clear, or
      run the plain .context/ check-in or check-out, with no commit or export.
  - session: wins for a plain .context/ check-in or check-out ("what should I work on", "resume
      work") without commits, exports or narrative.
  - capture-chat: wins when the only ask is to export or archive the conversation, optionally
      with artifacts, as markdown.
  - teaching-block-synthesized: wins when the user wants one publishable article from the
      session with diagrams and rendered HTML, not raw narrative material.
  - extract-codify-patterns: wins when they want the full look-over-my-shoulder bundle (README,
      brief, chat export, vault artifacts) for sharing.
  stage: close-out
  source_hash: 93ca52cff6b2
aimm-commands:
  description: Library of 66 named AIMM prompt commands (skeptic, canon-lock, blind-spot-scanner,
    transcript-miner, ...); use for "/aimm:<name>", "run the skeptic", or any request naming
    an AIMM command.
  summary: 'A router over a library of 66 named AIMM prompt commands from the AIMM mastermind:
    audits, adversarial reviews, thinking frameworks, persona critics, and content operations
    (skeptic, canon-lock, blind-spot-scanner, advisory-board, avatar-audit, constraint-first-audit,
    modal-subtraction, meta-prompt, cognitive-capture, brand-alignment-audit, geo-page-audit,
    and many more). Input is the user''s request plus whatever material the chosen command
    works on (a draft, plan, transcript, website, decision). It matches the request to exactly
    ONE row in its index table, or loads the named command directly when the user says "/aimm:canon-lock"
    or "run the skeptic", then reads only that command''s markdown file under commands/ and
    follows it against the user''s input. Output is whatever that single command defines:
    a critique, a map of blind spots, an advisory-board debate, a framework, a rewritten prompt.
    It never loads more than one command file, never merges commands, and when nothing matches
    well it lists the three closest and asks instead of improvising. The index is generated
    from the aimm-kb-agent knowledge base, so edits to commands belong there, not in this
    skill. Stage: operate, a dispatcher used at any point in a workflow where a named AIMM
    prompt protocol is wanted, typically before shipping work or when stuck on a decision.'
  requests:
  - /aimm:skeptic on this launch plan
  - run the canon lock on my framework before we keep going
  - use the blind spot scanner on my current thinking about this offer
  - convene the advisory board for this pricing decision
  - run avatar audit on this email before I send it
  - which AIMM command should I use to stress-test this idea?
  - do the modal subtraction thing to find an angle nobody else is hitting
  - run the AIMM brand alignment audit on my website
  not_for:
  - audit-fix: wins for a generic "audit this plan, find what we missed, then fix it" when
      no AIMM command is named.
  - cognitive-operations: wins for open-ended "think through this decision" or "run a pre-mortem"
      using the lenses and operations system, not a named AIMM command.
  - writing-team: wins when the user wants an article produced end to end rather than one
      prompt protocol applied.
  - paradigm-collision-engine: wins for "fresh angle on X" insight generation via parallel
      paradigm sub-agents.
  stage: operate
  source_hash: 61b515bbf226
trello-pipeline:
  description: Trello-based agentic product pipeline turning an idea into a PRD via staged
    AI agents on a live board; use for "run the Trello pipeline", "idea to PRD on my board",
    "set up the TrelloAgents board".
  summary: 'Trello-backed agentic product pipeline that takes a raw product idea through intake,
    feature decomposition, spec writing, review and PRD assembly, with the Trello board serving
    as both state engine and live dashboard. Everything ships in the skill folder: trello_ops.py
    (command surface documented in CLAUDE.md), setup_board.py, docs (INSTALLATION, CLAUDE_ORCHESTRATION,
    USER_GUIDE, QUICK_REFERENCE), and agents/ holding one prompt file per role: intake_analyst,
    feature_decomposer, spec_writer, spec_reviewer, prd_assembler, final_reviewer. The orchestrator
    spawns a general-purpose subagent per role with that role''s file as instructions, never
    pasting more than one role into a single agent. First-time setup needs Trello API credentials
    in .env, pip install anthropic and python-dotenv, and a board_config.json created by setup_board.py;
    if either is missing it walks the user through INSTALLATION.md first. Output is a PRD
    plus the board''s card trail. Safety rule: trello_ops.py delete_all is destructive and
    never runs without explicit user confirmation. How-it-works questions are answered from
    the user guide and quick reference. Stage: plan, idea-to-PRD ahead of any build.'
  requests:
  - Run the Trello pipeline on my product idea
  - Idea to PRD on my board
  - Set up the TrelloAgents board
  - Move the next card through the spec writer and reviewer stages
  - How does the Trello pipeline work?
  - Assemble the PRD from the approved feature specs on the board
  not_for:
  - harness-prd: wins when designing a stateful-agent-harness ProcessSpec as a state machine
      of agents and gates, with no Trello board.
  - grill: wins when the user wants to be interviewed one question at a time to converge on
      a decision or spec without a board.
  - to-issues: wins when the plan or PRD already exists and needs slicing into tracker issues.
  - wbs-toolkit: wins for outcome-driven WBS planning and verified code execution.
  stage: plan
  source_hash: dba2a9dae922
editorial-desk:
  description: Senior-editor orchestrator running specialist contributors (strategist, angle,
    drafter, adversary, headline) over a shared blackboard; use for "run the editorial desk",
    a critiqued-and-revised opinion/POV essay, or a sharp argument piece with editorial review.
  summary: 'Senior-editor orchestrator for producing a sharp opinion, POV or argument essay
    with built-in editorial review. The Desk drives a deterministic Python CLI (wt) that owns
    state, routing, validation and prompt assembly, and spawns every piece of intelligence
    as an Agent call (no LLM API, no key). Input: a topic and request, from which the Desk
    writes a brief (audience, belief-shift, one idea), gets it approved, then seeds a spine
    of tasks: research, synthesis, angle (cold fanout of three, then a select step), architecture,
    draft, voice, adversarial critique, headline (fanout plus select). Each task is matched
    to a model and effort tier supplied by the CLI, never hardcoded. Contributors return text
    only; the Desk persists them on a file blackboard under .ambient/ and mutates the plan
    solely through wt plan apply-deltas. An editors_read at decision points (batch ready,
    milestone, conflict) produces advisory findings and plan deltas such as send-backs, summoned
    experts and convened meetings. Milestone checkpoints block for human approval in checkpoint
    mode and are logged in autonomous mode. Finishes with wt finalize, render and a run report.
    Resumable from disk. Refuses direct API calls, acting on verdicts instead of deltas, and
    reconstructing prompts by hand. Stage: full authoring run, brief to headline.'
  requests:
  - Run the editorial desk on this topic
  - Write a sharp opinion piece and have it critiqued and revised
  - I want a point-of-view essay with an adversary tearing it apart before I publish
  - Run the desk with three competing angles and pick the best thesis
  - Take this brief through strategist, drafter, adversary and headline
  - Resume the editorial desk run where it stopped
  - Build an argument piece with editorial review checkpoints
  not_for:
  - writing-team: the user wants a straightforward research, draft, edit pipeline to a publish-ready
      article without the blackboard and tiered Agent orchestration.
  - editor: a draft already exists and only needs a light surgical edit, not a multi-contributor
      critique run.
  - writer: the user just wants a first draft from a brief, one stage, no review loop.
  - hot-take-forge: the user wants to harden a single contrarian claim, not produce a full
      essay.
  - gauntlet: the work is not an essay and needs generic criteria, independent critics and
      evidence ledgers.
  stage: draft
  source_hash: ed92d60b154b
to-issues:
  description: Breaks a plan, spec, or PRD into independently-grabbable tracer-bullet issues
    on the project's issue tracker; use for "turn this plan into issues", "break this PRD
    into tickets".
  summary: 'Breaks a plan, spec or PRD into independently-grabbable issues on the project''s
    issue tracker, shaped as tracer-bullet vertical slices. Input is whatever plan is already
    in the conversation, or an issue reference (number, URL or path) it fetches with full
    body and comments; it needs to know the tracker (GitHub Issues, Linear, etc.) and the
    triage label, and asks if not given. It optionally explores the codebase to use the domain
    glossary and respect ADRs, and looks for prefactoring to do first. Each slice cuts narrowly
    but completely through every layer (schema, API, UI, tests) and is demoable or verifiable
    alone, never a horizontal slice of one layer. It then quizzes the user with a numbered
    list showing title, blocked-by, and user stories covered, and iterates on granularity
    and dependencies until approved. Only then does it publish, in dependency order so blockers
    have real identifiers, using a fixed template: Parent, What to build, Acceptance criteria
    checklist, Blocked by. Issues carry the triage label so AFK agents can pick them up. It
    avoids file paths and code snippets in bodies unless a prototype snippet encodes a decision,
    and never closes or modifies a parent issue. Stage: plan, between spec and build.'
  requests:
  - Turn this plan into issues
  - Break this PRD into tickets
  - Slice this spec into tracer-bullet issues on GitHub
  - Split issue 42 into independently-grabbable pieces
  - Create Linear tickets from the plan we just agreed
  - Make these work items small enough for AFK agents to pick up
  not_for:
  - wbs-toolkit: wins when the user wants an outcome-driven WBS tree with verified execution
      rather than tracker issues.
  - grill: wins when the plan or spec does not exist yet and must first be converged on through
      one-question-at-a-time interviewing.
  - harness-prd: wins when designing a stateful agent process spec instead of slicing a plan
      into tickets.
  - project-brief: wins when the user wants a one-page project overview, not issues in a tracker.
  stage: plan
  source_hash: 98030ca48f15
harness-prd:
  description: Interviews the user to design a stateful-agent-harness ProcessSpec (a state
    machine of agents, skills, gates, artifacts); use for "build an agent process for X",
    "spec out an agent pipeline". NOT for code work-breakdowns (wbs-prd).
  summary: 'Designs a stateful-agent-harness application from intent in two strictly separate
    phases. Phase 1 is a one-question-at-a-time interview, each question carrying a recommended
    answer, that walks the ProcessSpec schema (references/process-spec.md) as its agenda:
    outcome and intent patterns, required and optional run-spec fields, ordered phases (typically
    3 to 10) that become action states, human approval gates, transitions with pass and failure-classification
    labels and retry limits, agents and roles, skills, artifact schemas, and context and memory
    policies. It reads the repo or the canonical library instead of asking when the answer
    is findable. Phase 2 synthesizes only from the interview: a markdown design brief for
    sign-off, then the formal ProcessSpec, then a call to compileProcess in src/lib/compiler/compile.ts
    with a composite library, fixing reported stage errors, then a walking-skeleton run driven
    to a terminal state on stubs. Hard rules: the entry state is confirm_run_spec of type
    approval, at least one terminal_success state exists, library skills are reused by skillRef
    before any inline skill is invented (new ones flagged as promotion candidates), prompts
    are templates with injects, and evaluators never route, transitions do. The report lists
    reused versus new skills and unfilled handAuthored prompts. It refuses to produce code
    work packages. Stage is plan.'
  requests:
  - build an agent process for onboarding new clients
  - spec out an agent pipeline for weekly reporting
  - design a state machine of agents with approval gates
  - interview me and write a ProcessSpec for this workflow
  - I want a stateful harness app that drafts, reviews and publishes
  - turn this multi-step agent workflow into a compilable process spec
  not_for:
  - wbs-toolkit: wins when the work is a code work-breakdown tree of work packages to implement
      and verify, not the design of a running agent state machine.
  - grill: wins when the user wants a general decision or spec interview with no ProcessSpec
      schema or compiler involved.
  - trello-pipeline: wins when the idea-to-PRD flow should run through staged agents on a
      Trello board.
  - software-dev-factory: wins when the user wants to run a governed software development
      lifecycle, not design a new agent process.
  - editorial-desk: wins when the user wants an orchestrated editorial team to produce a piece,
      not a spec for building one.
  stage: plan
  source_hash: baca1b85f08c
graphify:
  description: Turns any folder of files into a persistent, queryable knowledge graph with
    community detection; use for codebase/architecture questions, "graphify this", or any
    content query when graphify-out/ exists.
  summary: Builds and queries a persistent knowledge graph from any folder, GitHub repo URL,
    or set of repos. Input is a path (default current directory), one or more github.com URLs,
    or a natural-language question when graphify-out/graph.json already exists, in which case
    it skips the build and runs graphify query immediately. The pipeline installs the graphifyy
    Python package, detects files by type (code, docs, papers, images, video), runs deterministic
    AST extraction on code, dispatches parallel subagents for semantic extraction of docs
    and images (or Gemini if a key is set), transcribes audio and video, then clusters the
    result with community detection. Edges carry an honest audit trail labelled EXTRACTED,
    INFERRED or AMBIGUOUS. Outputs under graphify-out/ are interactive HTML, GraphRAG-ready
    graph.json, and a plain-language GRAPH_REPORT.md, with optional Obsidian vault, wiki,
    SVG, GraphML, Neo4j or FalkorDB exports, an MCP stdio server, and a watch mode. Subcommands
    include add <url>, query with BFS or DFS and token budget, path between two concepts,
    explain a node, --update for incremental rebuilds and --cluster-only. It warns and asks
    to narrow the scope on corpora over 500 files or 2M words, and it will not read files
    one by one instead of using subagents. Stage is research, a comprehension layer other
    work queries.
  requests:
  - graphify this repo
  - build a knowledge graph of this folder
  - how does authentication flow through this codebase?
  - what connects the billing module to the database?
  - map the architecture of github.com/org/repo
  - update the graph with the files I changed
  - export this graph to Neo4j or Obsidian
  not_for:
  - project-index: wins when the user wants a flat inventory table of folders with a one-line
      status each, not a queryable graph of file contents.
  - researcher: wins when sources must be gathered from the web into a research dossier rather
      than mapping files the user already has.
  - knowledge-base-architect: wins when the user is deciding on a vector-database or chatbot
      stack for their own expertise, not graphing a folder.
  - project-brief: wins when the user only needs a one-page overview of what a project is.
  stage: research
  source_hash: c064b158aa02
gmail-triage:
  description: Two-phase Gmail inbox sweep via the gmail MCP — batch-archive junk, then triage
    real emails one at a time; use for "check my email", "clean up my inbox".
  summary: Interactive three-step inbox sweep over the Gmail MCP, invoked as /checkemail.
    Input is an optional account name; with none given it covers every configured account.
    It lists the latest 25 emails per account in parallel, then calls get_thread on each threadId
    to see whether the user already sent the last reply, never trusting a single-message read.
    Each email is classified as Archive (newsletters, promotions, social notifications, calendar
    accepts, automated receipts, GitHub merge notices, tool update notices, threads waiting
    on someone else) or Triage (action needed, unread from a real person, financial or legal).
    It presents proposed archives as per-account tables with a reason, plus a numbered triage
    queue, and asks for one confirmation before touching anything. On approval it runs batch_modify
    archive per account and moves any excluded items into triage. Then it walks the triage
    queue one email at a time, unread action items first, offering Archive, Reply or Skip,
    and ends with a count of archived, replied and skipped. It always passes the account parameter
    explicitly and drafts replies for approval, so it never auto-sends and never shows the
    next email before the user decides. Output is an emptied inbox plus a closing tally, not
    a file. Stage is operate, a recurring personal-operations chore rather than part of a
    build or writing pipeline.
  requests:
  - check my email
  - clean up my inbox
  - run checkemail on my work account
  - archive all the junk and walk me through what's left
  - triage my inbox one email at a time
  - what in my inbox actually needs a reply?
  - sweep all my Gmail accounts and show me what to archive
  not_for:
  - gmail-manager: wins for one-off Gmail tasks like searching for a specific message, sending
      a new email, applying labels or managing filters, where no inbox sweep is wanted.
  - aimm-newsletter: wins when the goal is sending a newsletter to a Google Contacts group
      rather than processing incoming mail.
  - gears-broadcast: wins when the user wants to email GEARS licensees through Resend, not
      triage received mail.
  - trigger-runner: wins when the request is to run a folder's due standing triggers, even
      if one of them happens to involve email.
  stage: operate
  source_hash: ca2df29bef97
gmail-manager:
  description: General Gmail management across accounts via the gmail MCP (search, read, send,
    label, archive, drafts); use for "send an email", "find that thread", or mailbox actions
    beyond triage.
  summary: 'General Gmail management across multiple accounts through the gmail MCP, invoked
    as /email with free-form arguments. Must first load tools via ToolSearch with query +gmail.
    Tools covered: list_emails, search_emails, read_email, get_thread, get_labels, send_email,
    draft_email, reply_email, archive_email, label_email, trash_email, batch_modify. Actions:
    no args or triage (ask which accounts, list 25 per account, group by sender or category,
    flag urgent, ask before acting), cleanup (four phase daily workflow: cleanup of promotions
    and newsletters with batch archive on approval, triage into urgent, action, FYI and quick
    decisions, walkthrough of urgent items, then decisions one at a time), search {query}
    across chosen accounts, send, draft, reply compose, and labels. Rules: always pass the
    account parameter explicitly, never rely on the default; present summary tables before
    asking for actions; confirm every batch operation; show sender, subject, date and snippet
    rather than full bodies unless asked; always check the full thread with get_thread before
    saying an action has not been taken, since read_email returns one message; always show
    drafts and wait for approval before sending, never auto-send replies. Stage: operate,
    mailbox work in any account.'
  requests:
  - Send an email to Sarah about Thursday
  - Find that thread about the contract with the vendor
  - Draft a reply to this email but let me review it
  - Show me my Gmail labels
  - Search all my accounts for invoices from last month
  - Archive these newsletters and label the rest
  - Did I ever answer Mark's email? Check the thread
  not_for:
  - gmail-triage: the user wants the two-phase inbox sweep, batch-archiving junk then triaging
      real emails one at a time ("check my email", "clean up my inbox").
  - gears-broadcast: the email goes to the GEARS licensees segment via Resend, not from a
      Gmail account.
  - aimm-newsletter: the email is a newsletter to a named Google Contacts group needing a
      recipient preview.
  stage: operate
  source_hash: 8c2a502d2269
gears-broadcast:
  description: Sends any email to GEARS licensees (gears_owners) via Resend, drafting subject/body
    with the user if not already given, straight from raw HTML/text with no dashboard-editor
    round trip; use for "send a gears broadcast", "email the licensees", "notify gears owners",
    "send this to gears_owners".
  summary: 'Sends an email broadcast to the GEARS licensees segment (gears_owners) through
    the Resend MCP, skipping the dashboard visual-editor round trip. Inputs: a subject and
    markdown body (used as given when supplied in the invocation, otherwise drafted with the
    user), optional preview text, optional sender override. Known values are baked in: segment
    gears_owners ID 012ce100-aa6e-4ff5-be55-f169baa381bc (re-resolve via list-segments if
    rejected), default sender Coach Lou <support@coachlou.com>, sign-off "''Til the next time!"
    / Lou / "Service. Impact. Joy. Prosperity." Process: convert markdown to inline-styled
    HTML (paragraphs, bold, italics, bullet lists, headings as bold paragraphs, links, rules),
    inject it into assets/template.html by replacing {{SUBJECT}}, {{PREVIEW_TEXT}}, {{BODY_HTML}}
    and {{SIGNOFF_NAME}} while leaving Resend''s triple-brace merge fields intact, derive
    a plain-text version, call create-broadcast directly with html, text, segmentId, from,
    subject, previewText and a descriptive name, then preview subject, preview text and body
    in chat. It only calls send-broadcast after an explicit per-instance yes. Refuses to use
    compose-broadcast, get-tiptap-json-content or connect-to-editor, and never sends without
    confirmation. Stage: publish and send, final outbound step.'
  requests:
  - Send a GEARS broadcast
  - Email the licensees about the new release
  - Notify gears owners that the update is live
  - Send this to gears_owners
  - Draft and send an announcement to GEARS licensees
  - Broadcast this message to everyone in the gears_owners segment
  not_for:
  - aimm-newsletter: the audience is a named Google Contacts group such as AIMM members, not
      the Resend gears_owners segment.
  - gmail-manager: the user wants an ordinary one-to-one email sent, searched or drafted from
      a Gmail account.
  - publish-article: the goal is putting a finished article on the AIMM hub website, not emailing
      licensees.
  stage: send
  source_hash: 8ba3fb993e64
solofactory:
  description: Installs and operates SoloFactory, a local-first software factory (interview
    → PRD → subscription-backed build → gates → local deploy) as a folder's agentic function
    with each project a git repo under projects/ or the root; use for "set up solofactory
    here", "make this folder a software factory", "start the factory", "update my solofactory".
  summary: 'Installs and operates SoloFactory, a local-first software factory that turns a
    folder into a workspace where an owner can go from idea to running app. The flow is an
    interview guide, a frozen PRD, plan and acceptance contract, a build using the owner''s
    own signed-in Codex or Claude Code subscription, deterministic gates, and a local deploy
    on localhost. No API keys are requested or stored. Install uses the ambient-folder installer
    to write .aai/ (owned), a vendored .ailib/solofactory with run.sh and the bundled app/,
    a root start.sh, and projects/ with one workspace per project; re-running updates .ailib
    without touching .aai or projects. Operation starts the factory UI at 127.0.0.1:4173,
    selects a project, and inspects state through .aai/*.md, git log and .solofactory/runs.
    When the owner talks to it in chat ("hey solofactory", "how''s my app", "add X to my app",
    a bare option number), it follows drive.md and offers only numbered options the factory
    can really do. Needs Node 22+ and a signed-in CLI. It never starts a real build without
    explicit go-ahead since builds spend quota (SOLOFACTORY_DEMO=1 is free), never edits .ailib
    in a target folder, and never installs into the library repo. Stage: setup and operate.'
  requests:
  - Set up solofactory here
  - Make this folder a software factory so I can build an app by answering questions
  - Start the factory
  - Hey solofactory, how's my app going?
  - Add a dark mode to my app using the factory
  - Update my solofactory install
  - What can I do next in the factory?
  not_for:
  - software-dev-factory: wins when the user has an approved spec and wants a governed plan,
      red, green, review controller with byte-bound approvals.
  - vibe: wins when the user wants a persistent test-first chat loop editing a local web app
      directly, not an interview-to-PRD factory.
  - wbs-toolkit: wins for outcome-driven WBS planning and verified execution of a project
      spec.
  - grill-with-prototype: wins when the user wants a clickable prototype and SPEC.md produced
      during a requirements interview, not a full build factory.
  - ambient-folder: wins for general folder scaffolding or vendored-skill re-sync with no
      factory involved.
  stage: operate
  source_hash: 4abd92de15ea
software-dev-factory:
  description: Installs and operates the software development factory, a governed SDLC controller
    that drives your own Claude Code or Codex CLI through plan, red, green and review against
    an approved spec, as a folder's agentic function with one git repository per product under
    projects/; use for "set up the software dev factory here", "make this folder a software
    factory", "approve a spec", "run the factory", "update my software-dev-factory".
  summary: 'Installs and operates the software development factory, a governed SDLC controller,
    as a folder''s agentic function. It takes a spec the owner approved by exact bytes and
    walks it through plan, red, green and review, driving the owner''s own signed-in Claude
    Code or Codex CLI as labour. Each hand-off is verified by code reading real artifacts
    (the actual diff and test output), so a worker''s "done" advances nothing; evidence lands
    in git refs. Install writes .aai/ (owned), a vendored .ailib/ with the bundled controller
    in app/, a root ./factory launcher, and projects/ holding one git repo per product, via
    the ambient-folder installer; re-running is the update path. Operation uses ./factory
    init, approve, run, verdict and diagnose. Needs macOS (sandbox-exec confinement, opt out
    with FACTORY_CONFINEMENT=none on Linux or WSL2), Node 22.12+ and a signed-in CLI. It refuses
    to approve specs, record verdicts or merge on the owner''s behalf, never starts a run
    that spends subscription quota without explicit go-ahead, and the controller never commits,
    pushes, releases or deploys. Never edit .ailib in a target folder. One operation per request.
    Stage: setup and operate, the build-governance stage after a spec exists.'
  requests:
  - Set up the software dev factory in this folder
  - Make this folder a software factory with a governed build process
  - Approve this spec and run the factory on it
  - Run the factory against specs/login.spec.md and park at review
  - Record the verdict on the review for this run
  - Update my software-dev-factory to the latest version
  - Diagnose why the factory run stopped at baseline
  not_for:
  - solofactory: wins when the owner wants the local-first factory with an interview, PRD,
      subscription build, gates and localhost deploy rather than spec-byte approval and plan/red/green/review.
  - wbs-toolkit: wins when the need is outcome-driven work-breakdown planning and verified
      execution, not an SDLC controller driving CLI agents.
  - vibe: wins when the user wants a fast test-first conversational build loop on a local
      app without formal spec approval.
  - init-dev-project: wins when only scaffolding a folder into the dev-and-deploy standard
      as a git repo is needed, with no governed run lifecycle.
  - ambient-folder: wins for generic folder ambient setup or re-syncing vendored skills unrelated
      to the factory.
  stage: operate
  source_hash: 6e610689372b
wbs-toolkit:
  description: Installs and operates the outcome-driven WBS toolkit as a folder's agentic
    planning and verified execution function; use for "set up WBS here", "spec this project",
    "run the WBS", or "update the WBS toolkit".
  summary: 'Installs and operates the outcome-driven WBS toolkit as a folder''s planning and
    verified-execution function. Install input is a target project path; it runs the ambient-folder
    installer (a no-write --check plan first, then the real run, or a curl bootstrap one-liner)
    and writes .aai/ (identity, instructions, context), a vendored .ailib/wbs-toolkit/app/
    snapshot holding the pinned Python CLI, the wbs-prd and wbs-exec skills, docs and schema,
    a wbs.sh launcher, and appended CLAUDE.md and AGENTS.md anchors. Requires Python 3.10+,
    with uv preferred and PyYAML as fallback. An INSTALL.md runbook covers non-technical owners
    on macOS and Windows WSL2. Operating inside an installed project: run the requirements
    interview or "wbs.sh init docs/prd.md", then loop "wbs.sh next", "start <node>", implement,
    "done <node>". When done returns awaiting_proof_approval, review the integrated evidence
    with the owner before "approve-proof". "status" shows progress, strategy and Proof Slice
    state; "strategy legacy_bottom_up" only on explicit owner choice. Output is a .wbs/ work
    tree of confirmed results, traceable leaf work packages, and verified code. Refuses to
    edit .ailib/wbs-toolkit/ by hand (update by re-running the installer; personalise via
    .aai/skills/wbs-toolkit/), warns that done and approve-proof execute declared shell verification
    commands so only trusted projects qualify, and runs no server and holds no API credentials.
    Also covers library-owner sync via scripts/sync-distro.sh. Stage: setup, then operate.'
  requests:
  - set up WBS here
  - spec this project before we build it
  - run the WBS, what's the next work package
  - update the WBS toolkit in this folder
  - turn this PRD into a work tree and execute it
  - approve the proof slice
  - install the WBS toolkit for a non-technical client on a Mac
  not_for:
  - vibe: wins when the user wants a fast conversational test-build loop on a small app, not
      a formal spec tree.
  - software-dev-factory: wins when the user wants the governed plan, red, green, review SDLC
      controller with one git repo per product.
  - solofactory: wins when they want the local-first interview to PRD to subscription-backed
      build and deploy factory instead of a WBS tree.
  - harness-prd: wins when the thing being specified is a stateful agent pipeline or ProcessSpec,
      not a code work breakdown.
  - to-issues: wins when the plan should become tracker issues or tickets rather than a local
      .wbs tree.
  stage: setup
  source_hash: f4a6ff7073b2
token-activity-graph:
  description: Builds an interactive self-contained HTML graph of token usage by day, app,
    and model with live pricing; use for "build a token activity graph", "show my token usage",
    "visualize my API costs".
  summary: 'Builds a single self-contained, interactive HTML graph of Claude Code token usage
    by day, app and model, with cost computed from live pricing. It reads ~/.claude/stats-cache.json
    (dailyModelTokens and modelUsage) and exits with "No Claude Code session data found" if
    absent. It fetches per-model input, output, cache read and cache write prices from models.dev,
    treats models without cost as $0 and lists them in the footnote, and derives cache prices
    (read = input x 0.1, write = read x 3) when missing. Daily totals, which combine all four
    token types, are split using each model''s lifetime mix from modelUsage; the 30/70 input/output
    fallback is only for models missing from modelUsage, because applying it everywhere overstates
    cost roughly 23 times. It writes token-graph.html with CSS variables for light and dark,
    a monospace font, an inline JSON data block validated before inlining, the bundled pinned
    graph.js inlined verbatim (never fetched, never swapped without check-graph.js passing),
    and a mount div. The footnote carries the stats date range since the cache can be stale.
    Claude Code only; other agents lack aggregated stats. The file must be opened in a browser,
    and the skill confirms the path. Stage: operate, a one-shot report generator.'
  requests:
  - Build a token activity graph
  - Show me my token usage by day and model
  - Visualize my API costs for Claude Code
  - How much have I spent on Opus this month?
  - Make an HTML chart of my Claude Code usage with live pricing
  - Which app burns the most tokens for me?
  not_for:
  - ireport: wins when the user wants a styled HTML research report on a topic or notes, not
      a usage graph from local stats.
  - project-index: wins when the user wants an inventory of folders and their status rather
      than token charts.
  - chat-n-build: wins when the user wants a live, interactive local dashboard driven by chat
      for an ongoing process.
  - graphify: wins when the user wants a knowledge graph of files or a codebase, not a usage
      chart.
  stage: operate
  source_hash: 25ea74573bf4
distro-kit:
  description: Package any app repo as an ambient-library capability with one install standard
    (init/validate/publish); use for "make a distro", "package this for ambient-library",
    "publish capability", "distro-kit"
  summary: 'Packaging tool that turns any app repo into an ambient-library capability with
    one install standard, via three commands run through distro_kit.py. init takes an app
    repo path plus name, purpose, launcher, app-files list and runtime, and writes a distro/
    folder (instructions.md, run.sh, templates/aai/*.md, plugin.json) with TODO markers the
    author must fill. validate exits 0 only when the package satisfies what ambient-folder''s
    install.sh and scripts/sync-distro.sh actually read: required files, semver in plugin.json,
    SKILL.md name and description matching plugin.json, {{NAME}} in aai templates, every APP_FILES
    path present, and DEPENDS resolvable and including ambient-folder; it refuses while any
    TODO remains. publish runs validate, sync-distro, first-time promote, then writes catalog.yaml,
    marketplace.json and SKILLS.md entries and audits; the plugin.json description becomes
    the catalog line verbatim. It supports --check for plan only, --release to append RELEASE.yaml
    and run build-production.sh, and never commits. Updating means bumping the plugin.json
    version and re-running publish. distro/app/ is never hand-written; dirty app repos produce
    real sync warnings. Installs via the curl one-liner from the CAPABILITY-INSTALL-STANDARD,
    and publishing runs only inside the ambient-library dev workspace. Stage: packaging and
    release of a finished app into the library.'
  requests:
  - make a distro of this app
  - package this repo for ambient-library
  - publish this as a capability
  - run distro-kit validate on my app
  - bump the version and republish my capability
  - what does distro-kit init need from me
  not_for:
  - ambient-folder: wins when making an ordinary folder ambiently intelligent or re-syncing
      vendored skills, not packaging an app.
  - skill-auditor: wins when checking a library skill's SKILL.md and catalog projection against
      the schema.
  - init-dev-project: wins when scaffolding a brand new project folder to the dev-and-deploy
      standard before any packaging.
  - publish-article: wins when publishing a Markdown article to the AIMM hub rather than a
      capability to the library.
  stage: publish
  source_hash: 60e216fe7b98
vibe:
  description: Vibe mode — a persistent, test-first build loop for local web apps and CLIs.
    The user describes a change; the loop tests, builds, runs, screenshots, fixes, commits,
    and shows the result. Use when the user says "vibe on", "/vibe", "let's vibe this", "vibe
    code a ...", asks to install or set up vibe in a folder, or works in a folder whose .aai/instructions.md
    marks it as a vibe project. Also handles "vibe off". Do not use for a plain "I want to
    build" outside a vibe folder, or for WBS or formal spec requests.
  summary: 'Persistent, test-first build loop for local web apps and CLIs, switched on per
    folder (a vibe stamp in .aai/instructions.md) or per session ("vibe on", "/vibe"). The
    user describes a change in plain words; the skill touches them twice, at ask and at accept.
    Inputs: the request, plus the folder''s existing stack if code exists (Vite, React, TypeScript,
    Hono or FastAPI, SQLite, Vitest or pytest, Playwright by default for new apps). It sizes
    the request into tier S, M or L, writes observable acceptance checks and assumptions,
    asks at most five questions with proposed defaults, and confirms one-way doors (data model,
    auth, paid services, deleting data). Then it writes failing tests first, builds, and runs
    gates in order: build, unit tests, e2e, runtime console-error guard, screenshots at 1280px
    and 390px, docs gate. Each gate is green only if run this turn and exit 0, max five attempts
    per gate. Non-trivial diffs get a cold subagent review. Output is committed local code
    at green, updated README, PRD, FUNCSPEC, USERGUIDE and PLAN.md, a log in .aai/memory/vibe/log.md,
    and a shown result. Refuses to weaken, skip or delete tests, fake missing secrets or mocks
    as real, push to a remote, use git add -A, or overwrite existing .aai files. Large specs
    (over about 12 components or several people) graduate to a WBS workflow. Stage: build,
    the implementation loop after requirements are roughly known.'
  requests:
  - vibe on, let's build a small expense tracker web app
  - vibe code a CLI that renames my photos by date
  - it breaks when I click Save twice, fix it
  - add a dark mode toggle to this app and show me
  - set up vibe in this folder
  - keep going on the plan, next component
  - build me a one-screen app, test it, and screenshot the result
  not_for:
  - wbs-toolkit: wins when the project is large, multi-person, or needs a formal WBS spec
      and verified execution tree rather than a conversational build loop.
  - init-dev-project: wins when the user only wants a new folder scaffolded into the dev-and-deploy
      standard as a git repo, with no feature to build yet.
  - software-dev-factory: wins when a governed plan, red, green, review SDLC against an approved
      spec is wanted, driving Claude Code or Codex across products.
  - grill: wins when the user is still deciding what to build and wants to be interviewed
      one question at a time before any code.
  - fresh-eyes: wins when the task is walking existing docs or onboarding cold with a zero-context
      agent, not building or changing the app.
  stage: build
  source_hash: 3a8ebb664f4e
init-dev-project:
  description: Scaffolds a folder into the dev-and-deploy standard (lanes, four make verbs,
    spec/src/tests/deploy/docs layout, .aai/ with identity, purpose and the standard as a
    reference) and makes it a git repo; use for "init a dev project", "scaffold a new project",
    "set up a repo for X", "new skill/tool/app folder", "start a project the standard way".
  summary: Scaffolds a folder into the dev-and-deploy standard and makes it a git repo, via
    scripts/init_dev_project.py. Input is a target path (created if missing, else the current
    folder), plus name (default folder basename), a one-sentence description taken from the
    request, and an optional kind (skill, skill-app, tool, web) passed only if the request
    names one; otherwise the script detects kind from existing files (SKILL.md, manifest.json
    with bridge/, wrangler, Dockerfile, vercel.json) and falls back to the web layout. It
    asks the user nothing. Output is README.md, VERSION 0.0.0, CHANGELOG.md, Makefile with
    four verbs and gates, .gitignore, deploy/SHIPLIST picked by kind, spec/SPEC.md full of
    TODO placeholders so make check fails until filled, and an .aai/ folder with instructions,
    identity, purpose, context, checkpoint, HANDOFF and a version-stamped copy of the standard
    at references/dev-standard.md. It never overwrites existing files, so re-runs are safe,
    runs git init -b main with one commit and tag v0.0.0 only when not already inside a repo,
    and never adds a remote or pushes. src, tests, docs and tools are not pre-created. An
    opt-in interview runs ambient-folder Incept afterwards to rewrite identity and purpose.
    It will not make a stub check pass falsely. Stage is setup.
  requests:
  - init a dev project in ~/code/invoice-tool
  - scaffold a new project for a CLI that renames files
  - set up a repo for my new web app the standard way
  - new skill folder with the standard layout
  - start a project with lanes, make verbs and spec/src/tests/deploy
  - turn this existing folder into a proper git repo with the dev standard
  not_for:
  - ambient-folder: wins when the user wants a folder made ambiently intelligent through an
      interview about purpose, or maintained afterwards, rather than given the dev layout.
  - context-mgr: wins when the user wants only the multi-agent .context/ continuity system
      installed into an existing project.
  - distro-kit: wins when an existing app repo must be packaged as an ambient-library capability
      with an install standard.
  - software-dev-factory: wins when the user wants to install and operate a governed SDLC
      controller, not just the folder scaffold.
  - grill-with-prototype: wins when the spec has to be produced through a live prototype interview
      before any scaffolding matters.
  stage: setup
  source_hash: 69be7d991365
