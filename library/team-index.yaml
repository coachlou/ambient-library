ambient-folder:
  description: Makes a folder ambiently intelligent and maintains it — interviews for purpose
    when it's unclear, writes the .aai/ scaffold, vendors canonical capabilities into .ailib/,
    forks them, re-syncs; use for "make this folder ambient", "set up an agentic folder for
    X", "stamp .aai here", "interview me about this folder", "add a capability to this folder",
    "re-sync my vendored skills".
  summary: 'Makes a folder ambiently intelligent and keeps it that way. An ambient folder
    carries an owned .aai/ directory (instructions.md required, plus identity.md, context.md,
    optional memory/, references/, skills/) and a vendored .ailib/ of pristine canonical capabilities
    with a manifest.yaml. The skill performs exactly ONE operation per request: Incept (interview
    for a purpose the user cannot yet state, then stamp), Stamp (write the scaffold directly
    from a stated purpose), Install (vendor a canonical capability, with dependency closure),
    Personalize (fork a capability into .aai/skills), Learn (promote recurring memory into
    a reference rule), and Update (re-sync .ailib/ without touching .aai/). Inputs are a target
    folder path plus either interview answers or a purpose sentence; Match reads only catalog.yaml
    to propose capabilities, never skill bodies. Outputs are plain editable files, plus anchors
    appended to CLAUDE.md, AGENTS.md and any existing adapter files. Rules: confirm the absolute
    target first, never overwrite an existing .aai/instructions.md, never stamp into the library
    repo, invent no purpose or layout, refuse to stamp when the purpose is still a vague noun,
    and resolve capabilities by name with .aai/ shadowing .ailib/. Stage: setup, the first
    step that makes a folder usable by other skills.'
  requests:
  - make this folder ambient
  - set up a .aai folder for my client-proposals directory
  - I want this folder to act as my research assistant but I'm not sure how, interview me
  - install the writing-team capability into this folder
  - update the vendored skills in .ailib from the canonical library
  - fork the researcher skill for this folder so I can customize it
  - turn what keeps going wrong here into a standing rule for this folder
  not_for:
  - init-dev-project: wins when the folder is a code project needing the dev-and-deploy standard
      with lanes, make verbs and a git repo.
  - context-mgr: wins when the need is the multi-agent .context/ continuity store, not an
      .aai/ scaffold.
  - connector-bridge: wins when the task is resolving a folder's connectors.md against available
      MCP tools.
  - distro-kit: wins when packaging an app repo as a capability for publication to the library.
  - trigger-runner: wins when running a folder's standing intentions from triggers.md.
  stage: setup
  source_hash: 16f13e0031ad
context-mgr:
  description: Installs the multi-agent .context/ continuity system into a project; use for
    "install context-mgr", "set up multi-agent context here", "scaffold .context/", "add the
    shared brain to this project".
  summary: 'Installer that scaffolds the multi-agent .context/ continuity protocol into a
    target project so several agents, models and CLI windows can hand off work without losing
    state. Input: a target directory (default the current working directory), optionally flags
    for overwrite or skipping hooks. It runs library/context-mgr/install.sh, first with --check
    to list conflicts, then for real. Installed artifacts: .context/ with CHARTER.md (static
    protocol), STATE.md (live board), LOG.md (handoff journal), DECISIONS.md, README.md and
    archive/; a .claude/settings.json with SessionStart and Stop hooks (merged if one exists);
    agents.yaml routing table; AGENTS.md (Codex bootstrap); GEMINI.md (Gemini bootstrap);
    context-run.sh wrapper for non-Claude CLIs; and a .context/lock line added to .gitignore.
    Idempotent: never overwrites unless --force, which it must not use when .context/ already
    holds real LOG or DECISIONS history without the user confirming. Suggests git init if
    the target is not a repo. Afterward it tells the user to edit agents.yaml, set the active
    objective in STATE.md, and start sessions with "what should I work on?". It does not run
    check-in or check-out; that is the session skill. Stage: one-time project setup, upstream
    of session and checkpoint use.'
  requests:
  - install context-mgr here
  - set up multi-agent context in this project
  - scaffold .context/ for me
  - add the shared brain to this repo
  - I want Claude, Codex and Gemini to hand off work in this project
  - set up agents.yaml and the context hooks
  not_for:
  - session: wins when .context/ already exists and the user wants to resume, check in, check
      out or ask what to work on.
  - checkpoint: wins when the goal is saving state before /compact or /clear, or a handoff
      note into .aai/checkpoint.md.
  - ambient-folder: wins when the user wants a folder's .aai/ intelligence scaffold and vendored
      capabilities rather than the .context/ protocol.
  - init-dev-project: wins when scaffolding a whole new project folder to the dev-and-deploy
      standard with git and make verbs.
