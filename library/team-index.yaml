session:
  description: Runs session check-in/check-out against a project's .context/ store; use for
    "what should I work on", "resume work", "checkpoint", "session check-in/check-out". Requires
    (or offers to bootstrap) a .context/ directory.
  summary: 'Runs the check-in, checkpoint, check-out and status rituals against a project''s
    .context/ store, the shared brain every agent, model or CLI window reads on entry and
    updates on exit. Needs a repo with .context/CHARTER.md, STATE.md, LOG.md and DECISIONS.md;
    if the store is missing it asks before bootstrapping, never silently. Check-in verifies
    the store, inspects a short-lived lock file, reads STATE and recent LOG, flags Doing tasks
    stale beyond four hours, picks a task by assignee, focus or the user''s override, moves
    it to Doing and reports in a few lines. Checkpoint stamps a progress note and a top LOG
    block without changing task status. Check-out commits code first, sets the outcome (Done,
    Ready-for-Review with a commit SHA, Doing, Needs-Rework), appends a LOG entry, optionally
    records a DECISIONS entry, and commits .context/ separately. Status is a read-only board
    summary. Also covers blind reviewer discipline for #review tasks (read the diff before
    the doer''s log) and bootstrapping a new store. Refuses to rewrite append-only history,
    to create a parallel .context/ in a worktree, to hold the lock for a whole session, or
    to invent work when nothing matches. Stage: operate, the per-session bookends of any project
    already using the context-mgr scaffold.'
  requests:
  - What should I work on in this project?
  - Resume work where the last session left off
  - Check me in to this project and pick up the next task
  - Checkpoint my progress, I'm mid-task
  - Wrap up and check out, log what I did
  - What's the status of the board right now, who is doing what?
  - Review the commit for T-14 using the reviewer protocol
  not_for:
  - checkpoint: wins when the goal is distilling conversation state into .aai/checkpoint.md
      before /compact or /clear, rather than updating the .context/ task board.
  - context-mgr: wins when the project has no .context/ yet and the user wants the multi-agent
      scaffold installed, not an ongoing session ritual.
  - wrap: wins when the user wants the full close-out ritual with conversation export, teaching
      narrative and memory harvest, not just a .context/ check-out.
  - capture-chat: wins when the user only wants the conversation exported as portable markdown,
      with no task or state bookkeeping.
  stage: operate
  source_hash: b947daa5c2bc
checkpoint:
  description: Preserves conversation context across compaction and hands off work across
    sessions, agents, and CLI windows — distills since-last-checkpoint state into the project's
    .aai/checkpoint.md before /compact or /clear, or runs the .context/ store check-in/check-out
    protocol; use for "checkpoint", "checkpoint before compact", "save context before clearing",
    "session check-in", "wrap up".
  summary: 'Preserves context across compaction and hands off work across sessions, agents
    and CLI windows, in two modes. Compact mode is the default (/checkpoint, /checkpoint:compact,
    any pre-compact or pre-clear save): it locates or creates <project-root>/.aai/checkpoint.md
    (moving a legacy root checkpoint.md in), reads what is already captured, distills only
    the delta since the last checkpoint into conclusions rather than transcripts (decisions
    with a one-line why, state, file paths touched, open questions, exact next steps), rewrites
    the 5 to 15 line Current state header, appends a dated section newest first, never rewrites
    dated history, and ends by telling the user to run /compact or /clear since it cannot.
    Session mode (/checkpoint:session or check-in and check-out language) runs the multi-agent
    protocol against a project''s .context/ store: verify CHARTER.md exists and ask before
    bootstrapping, check and briefly hold a lock only around mutations, treat every check-in
    as a stranger arriving by re-reading STATE and recent LOG, append to LOG.md and DECISIONS.md,
    share one .context/ across worktrees, and require a commit SHA before marking a task Ready-for-Review.
    Output is an updated checkpoint file or updated store entries. It does not archive transcripts
    or close sessions with commits. Stage: operate, run mid-session or at session boundaries.'
  requests:
  - checkpoint before I compact
  - save context before clearing
  - /checkpoint
  - session check-in, what should I work on?
  - checkpoint where I am so another agent can pick this up
  - log this and check out of the session
  - write a handoff for the next window
  not_for:
  - session: wins as the dedicated check-in and check-out skill for a project's .context/
      store when the user wants only that protocol.
  - wrap: wins when the user wants the full close-out ritual with commit, conversation export,
      teaching narrative and memory harvest.
  - capture-chat: wins when the user wants the verbatim conversation saved as a markdown file,
      not a distilled brief.
  - context-mgr: wins when installing the .context/ system into a project for the first time.
  stage: operate
  source_hash: 1492250736ea
aimm-newsletter:
  description: Sends a newsletter email to all members of a named Google Contacts group; use
    for "send this to [group]", "send the newsletter", "email the group". Previews recipients
    and content before sending.
  summary: 'Sends a finished newsletter as an HTML email to every member of a named Google
    Contacts group, through the Gmail MCP. Inputs are a subject line and a markdown body (it
    asks for either if missing), plus per-project settings resolved by scripts/resolve.py:
    group_name, send_mode, subject_prefix, unsubscribe_url, and environment values such as
    the sending account alias and from address. Workflow: resolve the project directory and
    tell the user where it will write; fetch the group with get_contact_group, which returns
    name and email pairs; convert the markdown to inline-styled HTML using fixed rules for
    paragraphs, bold, italics, bullets, headings, links and rules; fill assets/template.html,
    stopping if any unfilled placeholder remains; write a preview.html under .aai/memory for
    rendering; show a header listing project, sender, group, mode, subject and recipient names;
    then wait for an explicit yes. Sending is either individual (one call per member) or bcc
    (one call with the sender as the visible recipient, individual when only one member).
    It always applies the subject prefix, continues past per-member failures, and reports
    sent and failed counts. It refuses to skip the preview and confirmation, even when the
    user seems certain, and refuses to send with unresolved template values. Stage: publish,
    the final delivery step after the piece is written and approved.'
  requests:
  - send this to the AIMM group
  - send the newsletter to my mastermind list
  - email this post to everyone in the Alumni contact group
  - send the newsletter with subject 'Three things I learned this week'
  - blast this to my contacts group, bcc please
  - preview this newsletter and then send it to the group
  not_for:
  - gears-broadcast: wins when the recipients are GEARS licensees (gears_owners) and the email
      goes out through Resend.
  - gmail-manager: wins for a one-off personal email, a reply, or any mailbox action that
      is not a group newsletter send.
  - publish-article: wins when the goal is putting the article on the aimmhub.coachlou.com
      site rather than emailing a list.
  - writing-team: wins when the newsletter content still has to be researched, drafted or
      edited before sending.
