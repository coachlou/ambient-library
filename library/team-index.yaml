# Generated by scripts/build-team-index.py; do not edit. Read by team-build only.
connector-bridge:
  description: Resolves a folder's declared .aai/connectors.md needs against whatever the
    current harness actually offers (MCP tools, CLIs, or nothing), caching successful matches
    in .aai/memory/; use for "wire up this connector", "resolve connectors.md", "what can
    reach X here".
  summary: 'Resolver that matches a folder''s declared connector needs against what the current
    harness actually offers. Input: the target folder''s .aai/connectors.md, where each declaration
    names what must be reached (name, purpose, needs, and a required without-it line) but
    never a server name, tool binding or credential. The skill enumerates the session''s registered
    MCP tools, CLIs on PATH, or nothing, then judges per connector which offering satisfies
    it, for example a calendar need resolving to a Google Calendar MCP tool, an icalBuddy
    CLI, or no match. The model itself is the adapter, so there is no lookup table. On a match
    it uses the tool for the task and caches one line per connector in .aai/memory/connector-bindings.md
    in the form connector, resolver, confirmed date. On no match it applies the declaration''s
    without-it line, continues in degraded mode, and tells the user what setup the needs field
    implies. Hard rules: never write into connectors.md (the folder''s stable declaration),
    never treat a cached binding as proof without confirming the tool is available now, never
    block on no match, and never ask for credentials directly. If connectors.md is missing
    it stops. Produces the working tool choice plus the refreshed bindings cache. Stage: runtime
    setup inside an ambient folder, after the folder''s .aai scaffold exists and before tasks
    that need external reach.'
  requests:
  - wire up this connector
  - resolve connectors.md for this folder
  - what can reach my calendar here
  - which of this folder's declared connectors does this session actually have
  - do I have a tool for the CRM this folder needs
  - refresh the connector bindings cache
  not_for:
  - ambient-folder: wins when the .aai scaffold or connectors.md itself must be created, edited
      or interviewed into existence.
  - trigger-runner: wins when the task is running due standing intentions from .aai/triggers.md
      rather than resolving tool access.
  - audit-mcp: wins when the question is whether a third-party MCP server repo is safe to
      install.
  - gmail-manager: wins when the user simply wants to act on their mailbox through the already-wired
      Gmail MCP.
  stage: setup
  source_hash: 78937658a5ae
gauntlet:
  description: Runs ambitious work through explicit criteria, independent critique, and evidence-based
    revision loops.
  summary: 'Quality-bar workflow for ambitious or "make it perfect" work, built on the chain
    criterion, owner, evidence, critic, correction. Input: an artifact and goal; scope and
    constraints; a benchmark with inspectable evidence (an inaccessible or subjective benchmark
    counts as aspiration, not proof); done criteria; and which decisions need user authority.
    It converts superlatives into observable pass/fail checks with named evidence sources
    before acting, and does not start if a material unknown would change the work. It then
    builds a work matrix of bounded workstreams (artifact, owner, acceptance criteria, verification,
    dependencies) with one coordinator owning integration and the fewest agents that cover
    independent surfaces. Execution retains raw evidence suited to the artifact: tests and
    logs for code, rendered states and accessibility for visuals, source checks for writing,
    dry runs for operations. After each pass an independent critic who did not author the
    work, given goal, criteria, paths and benchmark but not the implementer''s rationale,
    returns what was inspected, standard, passes with evidence, failures with severity and
    smallest fix. Loops correct, re-verify, re-critique until each criterion passes or is
    deferred. Never claims perfect, production-ready or better-than-benchmark without direct
    evidence. Delivers artifact, criterion-by-criterion evidence ledger, residual risks and
    next step. Stage: build and verify loop.'
  requests:
  - Make this exceptional and prove it
  - Run this through a gauntlet with independent critics
  - I want AAA quality, define the criteria and verify each one
  - Build this and keep revising until it beats the benchmark with evidence
  - Get parallel specialists to build and review this feature
  - Don't tell me it's done until a reviewer has checked it against my criteria
  not_for:
  - audit-fix: the user wants a one-shot adversarial audit of an existing plan or change,
      with root-cause fixes, not a build-and-critique loop.
  - fresh-eyes: the thing to validate is a doc or onboarding journey, best tested by a zero-context
      walker.
  - editor: the task is a light surgical edit of a draft with no formal criteria or critics.
  - skill-evals: the user wants a skill's existing evals run and reported as PASS or FAIL.
  stage: build
  source_hash: 7c94c8afb1f8
project-brief:
  description: Creates a one-page project overview; use for "write a brief", "summarize this
    project", "project overview", "what is this project".
  summary: 'Writes a one-page, plain-language project brief for the current project and saves
    it as PROJECT-BRIEF.md in the project root. Inputs: whatever already exists in the project
    root (README.md, CLAUDE.md, other obvious description files), which it reads first rather
    than asking for what it can see. If goal and audience are still unclear after reading,
    it asks exactly one question: "What''s the main goal of this project, and who is it for?",
    and skips even that when the files make it clear. The artifact has a fixed structure:
    project name as title, a one-sentence italic tagline (what it does and who it is for),
    then Problem, Goal, Audience, and What''s included (3 to 5 bullets of key pieces or features).
    Rules are strict: one page maximum, plain language, no jargon (rewrite rather than define),
    no padding, never more than one question before writing. It closes with a fixed confirmation
    line asking the user to review PROJECT-BRIEF.md and request adjustments. Triggers include
    "write a project brief", "summarize this project", "create a project overview", and "what
    is this project?" when no summary exists. It does not scan multiple folders, build inventories
    or status tables, write long documentation, do research, or edit an existing brief beyond
    regenerating it. Stage: documentation, usually early in a project or before sharing it
    with someone new.'
  requests:
  - Write a project brief
  - Summarize this project in one page I can share
  - Create a project overview for this repo
  - What is this project? There's no summary yet
  - I need a PROJECT-BRIEF.md for the team
  - Give me a plain-language overview of what we're building and who it's for
  not_for:
  - project-index: Wins when the user wants an inventory or status of many folders (a table
      plus searchable HTML), not a one-page brief of a single project.
  - writer: Wins when there is an existing brief or notes and the user wants a longer piece
      drafted from them.
  - init-dev-project: Wins when the user wants a folder scaffolded into the dev standard with
      .aai and git, not a summary document.
  - graphify: Wins when the user wants a queryable knowledge graph of a codebase or folder
      for deep architecture questions.
  - ambient-folder: Wins when the user wants a folder given a purpose and .aai/ scaffold,
      not a shareable overview.
  stage: document
  source_hash: 9072acafe377
project-index:
  description: Scans one or more directories (no recursion) and produces a project inventory
    — markdown table plus a searchable, filterable HTML page — with an inferred one-line description
    and status per folder; use for "what have I been working on", "index my projects folder",
    "status of everything in this directory", "catalog these folders".
  summary: 'Scans one or more directories, immediate children only with no recursion by default,
    and turns them into a project inventory: PROJECT_INDEX.md (a four-column table of Project,
    Location, Status, Description plus a legend) and a self-contained, dark-mode-aware, searchable
    and filterable PROJECT_INDEX.html with status filter chips. Inputs: one or more directory
    paths, optional per-folder deeper scans or full recursion if requested, and optional user-specified
    status labels. A bash scan script emits JSONL per folder (name, git branch, last commit,
    dirty flag, remote, first 500 chars of README, package description, mtime, top files);
    the model then writes one sentence of under 20 words per folder and assigns a status,
    grounded only in scanned fields. Status vocabulary (3 to 6 short labels) is invented from
    content, not imposed, and folders are not assumed to be git repos. Over about 40 folders
    it fans out to parallel subagents. It never fabricates: thin folders are labelled "Unclear
    from available metadata" and flagged for manual review. A Python script builds the HTML
    (exit codes 0, 1 no rows parsed, 2 bad args). The report gives file locations, count per
    status, and the list of opaque folders. It does not read inside projects deeply, edit
    them, or write per-project briefs. Stage: inventory, an oversight or audit-style step
    across many folders.'
  requests:
  - Index my ~/GitHub folder
  - What have I been working on in ~/Projects?
  - Give me a status of everything in my Clients folder
  - Catalog the folders in ~/Downloads/handoffs
  - Index ~/GitHub and ~/work/repos in one pass, and go one level deeper in clients
  - Index ~/Clients and use Delivered / In progress / On hold as the labels
  - Make me a searchable HTML page of all my project folders
  not_for:
  - project-brief: Wins when the user wants a one-page overview of a single project, not an
      inventory across many folders.
  - graphify: Wins when the user wants a persistent, queryable knowledge graph of a folder's
      contents for architecture or content questions.
  - trigger-runner: Wins when the task is running a folder's declared standing intentions,
      not cataloguing folders.
  - ambient-folder: Wins when the aim is making a folder ambiently intelligent with an .aai
      scaffold, not listing what is in it.
  - token-activity-graph: Wins when the user wants an HTML visualization of token usage and
      cost, not project status.
  stage: inventory
  source_hash: e9b16ad0fc1d
researcher:
  description: Gathers sources into a structured research dossier; use for "research this
    topic", "find sources on X", "compile background". NOT for writing or editing the piece.
  summary: 'Single-stage research skill: gathers sources on a topic and returns a structured
    research dossier, then stops. It never drafts or edits the piece. Input is a topic or
    question, plus (only if not already obvious) what the research feeds, the angle or decision,
    and depth or recency constraints. It confirms the brief in one pass, then gathers using
    built-in WebSearch for discovery and WebFetch to read specific pages by default; Perplexity
    (search or ask) if available in the session for richer cited answers; Firecrawl only to
    scrape a specific URL already in hand, never for open-ended search. It prefers primary
    sources and requires a citable URL for every load-bearing claim. Output is either inline
    or a file RESEARCH-<slug>.md in the working directory with a fixed structure: Research
    title and brief, Key findings (claim, one-line evidence, source URL), Supporting detail
    grouped by evidence, Open questions / unverified, and a Sources list. Hard rules: never
    fabricate statistics, quotes, studies or named examples; unsourceable claims go under
    open questions rather than being dropped or papered over; separate what is known, argued
    and speculative. It ends by stating where the dossier lives and flagging unverified items.
    Stage: first step of the research, draft, edit pipeline, feeding the writer or a brief,
    and also usable standalone for background compilation.'
  requests:
  - 'Research this topic for me: AI adoption among mid-sized law firms'
  - Find sources on how Shopify handles tax at checkout
  - Compile background on retrieval-augmented generation for an upcoming article
  - What's known about the four-day work week? I want sourced findings, not a draft
  - Put together a research dossier with citations on cold-plunge benefits
  - Dig up primary sources for this claim before I write about it
  - Give me RESEARCH notes on competitors in the voice-AI space
  not_for:
  - writer: Wins when a brief or dossier already exists and the user wants a first draft written.
  - writing-team: Wins when the user wants research through draft and edit to a publish-ready
      piece in one run.
  - ireport: Wins when the deliverable is a styled interactive HTML research report rather
      than a plain markdown dossier.
  - editor: Wins when a draft exists and needs editing, not new sources.
  - paradigm-collision-engine: Wins when the user wants a non-obvious insight generated from
      multiple disciplinary lenses, not gathered evidence.
  stage: research
  source_hash: 5553b186bcdc
skill-auditor:
  description: Audits a skill's SKILL.md frontmatter, catalog.yaml projection, references,
    and evals shape against the library schema, reporting ordered actionable findings; use
    for "audit this skill", "does X follow the schema", "lint X against the catalog", "check
    X before I publish it".
  summary: 'Read-only auditor that checks one library skill directory against the publishing
    schema and reports ordered, deduplicated findings with copy-editable fixes. Input is a
    skill name, a path, or a directory for batch mode, plus an optional severity threshold;
    with no target it asks rather than guessing. It runs four checks in fixed order: frontmatter
    in SKILL.md (name equals directory, kebab-case, description present and at most 1024 chars,
    optional metadata.summary one line, status enum), catalog projection (catalog.yaml line
    must equal the summary-or-description flattened to single spaces; the fix is always running
    scripts/build-catalog.py, never hand-editing, and the script is only run with --check),
    reference resolution in instructions.md (relative links, plugin-root paths, assets, cross-skill
    names verified on disk), and evals presence and shape (absence is info, never a gate).
    It resolves the library root from the plugin path or by walking up for catalog.yaml plus
    the projector, and degrades gracefully with a distinct "not checkable here" info state.
    Output is a Markdown table, JSON in batch or CI, with severities blocker, error, warning,
    info and exit codes 0 to 3. It never edits the target, never opens other skills, and never
    executes evals. Stage: audit, a pre-publish gate.'
  requests:
  - Audit the gmail-triage skill against the library schema
  - Does deep-mirror follow the schema? Check its catalog entry
  - Lint project-brief before I publish it
  - Validate cognitive-mirror's SKILL.md frontmatter
  - Check that skill-evals' evals are well-formed
  - Batch-audit every skill in the library
  - Is the catalog.yaml line for this skill stale?
  not_for:
  - audit-fix: wins when the object is a plan or code change to pressure test and fix, not
      a skill directory's schema conformance.
  - audit-mcp: wins when the target is a third-party MCP server repo to security-vet before
      installing.
  - skill-evals: wins when the user wants a skill's evals actually executed with a PASS/FAIL
      table rather than checked for shape.
  - distro-kit: wins when packaging an app repo as an ambient-library capability with init,
      validate and publish, not auditing an existing skill.
  stage: audit
  source_hash: 1079c1d2ec06
skill-evals:
  description: Runs one skill's existing evals/evals.json — triggering cases against a fresh
    subagent, quality cases judged against prose pass criteria — and reports a PASS/FAIL table,
    no scores; use for "run the evals for X", "test this skill's evals", "does X still trigger
    right".
  summary: 'Executes one skill''s existing eval file, normally library/<skill>/evals/evals.json
    or a root-level <skill>-evals.json, and prints a per-case PASS/FAIL table to the conversation.
    It needs a target skill that already ships evals and reads references/schema.md when the
    eval shape is unfamiliar. Cases split by shape. Triggering cases (should_trigger present)
    each run in a fresh general-purpose subagent given only the prompt, with the ambient trigger
    installed and no hint about the skill under test, because a primed session cannot judge
    its own routing; it records whether routing hit the target, then reports the rate over
    should_trigger true cases (target above 0.5) and over should_trigger false cases (target
    below 0.5). Quality cases (expected_output or pass_criteria) run in the current context
    and the output is judged against the prose criteria, with the specific gap named on FAIL.
    The skill refuses to invent scores, percentages, levels or rubrics, never grades its own
    triggering cases, writes no report file unless asked, and does not create or edit evals.
    It is an executor, not a schema checker. Stage: audit, run after a skill is drafted or
    its description changes.'
  requests:
  - Run the evals for gmail-triage
  - Test this skill's evals and show me what fails
  - Does eigenthinking still trigger right after my description change?
  - Run the triggering cases for the editor skill in fresh subagents
  - Did my skill edit regress any quality cases?
  - Give me a PASS/FAIL table for the evals in this skill folder
  not_for:
  - skill-auditor: wins when the user wants evals or frontmatter checked for schema shape
      and well-formedness without running anything.
  - audit-fix: wins when the thing under review is a plan or change needing adversarial critique,
      not an eval file.
  - fresh-eyes: wins when validating docs, onboarding or workflows by a zero-context walkthrough
      rather than running a skill's eval cases.
  - audit-mcp: wins when the target is a third-party MCP repo needing a security audit.
  stage: audit
  source_hash: cd8ad13726f5
teaching-block-synthesized:
  description: Writes one publishable teaching-block article from a working session — real
    prompts, real outputs, wrong turns, reasoning, diagrams, and rendered HTML; use for "write
    this up as a teaching block", "field guide this", "debrief this session", "turn this session
    into an article". Any domain. For the full look-over-my-shoulder bundle (README, brief,
    chat export, vault artifacts) use extract-codify-patterns instead.
  summary: 'Turns a finished working session into one publishable teaching-block article,
    a first-person, past-tense field guide for AIMM practitioners who want to replicate the
    process, in any domain. Input is the session itself; it produces chat_exports/<slug>/
    with a faithful conversation.md, the article <slug>.md, SVG diagrams, and a self-contained
    rendered HTML (the deliverable) via render-article.py. Before drafting it finds the turning
    points: the real goal behind the task, moments that changed approach or understanding,
    why each turn went as it did, and what is understood now. The article states its payoff
    plainly in the title (How I..., How to..., N steps to...), with the specifics in the subtitle,
    then an orientation opening and one process section per step covering what was done and
    returned verbatim on both sides, what was noticed, why this way, and what changed. It
    shows the wrong path first, exhibits the artifact under construction and a full appendix,
    narrates headings in flight rather than from hindsight, and stamps at most six imperative
    concept stamps. Rules against curiosity-gap titles, fabricated transcripts, unmethodded
    measurements, forward references and unshown artifacts. The reasoning, not the artifact,
    is the subject. It does not build the full README, brief and vault bundle. Stage: draft,
    a write-up of completed work.'
  requests:
  - Write this up as a teaching block
  - Field guide this session
  - Debrief this session as an article for the members
  - Turn this session into an article that shows my real prompts and the wrong turns
  - Make a how-I-did-it walkthrough with diagrams and rendered HTML
  - Document what I just figured out so someone could follow the process
  not_for:
  - extract-codify-patterns: wins when the user wants the full look-over-my-shoulder bundle
      with README, brief, chat export and vault artifacts rather than a single article.
  - transcript-to-content-pipeline: wins when the goal is a content package (article, LinkedIn
      variants, summary, audio script) from a raw transcript, not a process walkthrough.
  - conversation-ip-extractor: wins when the user wants named frameworks and IP pulled out
      of a conversation, not a narrated article.
  - capture-chat: wins when the user only wants the conversation exported as markdown.
  - wrap: wins for the full session close-out ritual with commit, handoff and memory harvest.
  stage: draft
  source_hash: ac2766203516
trigger-runner:
  description: Runs a folder's declared .aai/triggers.md standing intentions — compares each
    to last-run stamps in .aai/memory/, runs what's due, and can offer promotion to native
    hooks/cron on a capable harness; use for "check triggers", "run due triggers", "session-start
    due-check".
  summary: 'Due-check runner for a folder''s standing intentions. Input is the target folder''s
    .aai/triggers.md (one-line declarations such as "weekly: re-sync .ailib/", "on session
    start", "on message via ...") plus the last-run stamps in .aai/memory/trigger-stamps.md,
    which it creates empty if absent. For each declaration it decides whether the trigger
    is due: no stamp means never run and therefore due, a cadence has elapsed (weekly stamped
    8+ days ago), the declared event is happening now, or, for inbound event triggers, unprocessed
    material sits in the folder''s inbox/. It then executes each due task one at a time with
    whatever tools the session has (it may hand off to connector-bridge when an external system
    is needed) and writes a fresh "<trigger line>: last run <date>" stamp. Output is the executed
    tasks plus updated stamps. Tier 1, the session-start due-check, is the always-safe default.
    Only on a harness that really has native cron or hooks, and only after the user accepts
    an offer, it generates a tier-2 hook or cron artifact marked as derived and regenerable.
    It never edits or removes the declaration in triggers.md, never stores stamps there, never
    assumes cron exists, never promotes unprompted, and stops silently if triggers.md is missing.
    Stage: operate, run at session start or on demand inside an ambient (.aai/) folder.'
  requests:
  - check triggers for this folder
  - run any due triggers
  - do the session-start due-check
  - what standing intentions are overdue in this project
  - is my weekly re-sync trigger due yet
  - promote my triggers to cron or hooks if this harness supports it
  - process anything waiting in the inbox trigger
  not_for:
  - connector-bridge: wins when the need is resolving connectors.md entries to MCP tools or
      CLIs rather than checking which triggers are due.
  - ambient-folder: wins when the folder has no .aai/ scaffold yet, or the user wants to create
      or edit the declarations and purpose rather than run them.
  - checkpoint: wins when the user wants to save conversation state before compact/clear or
      hand off work, not execute scheduled intentions.
  - session: wins for .context/ check-in/check-out and "what should I work on" rather than
      .aai/triggers.md stamps.
  stage: operate
  source_hash: c530ca2a8d28
writer:
  description: Drafts a piece from a brief (and optional dossier) — drafting ONLY, no research
    or editing pass; use for "draft this", "write a first draft from these notes", "turn this
    brief into a post".
  summary: 'Single-stage drafting skill. It turns a brief, plus an optional research dossier,
    into a first draft of long-form content and stops there: no research pass, no editing
    pass. Inputs it needs: the audience, the one main idea, the reader end-state (what they
    should think, feel or do afterward), and length or format. If any are missing it asks
    once, then drafts. Voice comes from the brief; if the brief names a voice and a matching
    file exists under ~/.aai/references/voice/ it loads that, otherwise it follows the described
    tone, and it honours ~/.aai/rules/content.md only as an optional enhancement that is never
    required. It structures before prose (lead, core argument, evidence or examples, resolution),
    draws evidence and citations only from the brief and dossier, and surfaces anything the
    dossier flagged as unverified rather than asserting it. Output is DRAFT-<slug>.md in the
    working directory (slug is kebab-case of the topic), or inline if asked, followed by a
    confirmation line giving the draft path and the single main idea written toward so the
    caller can sanity-check the angle. Rules: one main idea per piece, concrete over abstract,
    take a point of view with no hedging, never invent facts or sources, draft for ideas rather
    than polish. It refuses to research, to polish an existing draft, or to run the whole
    pipeline. Stage: draft, the middle step between researcher and editor.'
  requests:
  - draft this from my notes
  - write a first draft from this brief
  - turn this brief into a post
  - write the article, I already have the outline and research
  - use the dossier to draft a 1200-word piece for operators
  - give me a rough draft I can react to
  - write it in the voice described in the brief
  not_for:
  - editor: wins when a draft already exists and needs surgical editing, polishing or tightening.
  - researcher: wins when sources and background still have to be gathered before anything
      can be written.
  - writing-team: wins when the user wants the full research, draft and edit pipeline end
      to end to a publish-ready piece.
  - brand-writing-team: wins for brand-building posts that need a structured intake and a
      full multi-role team run.
  - voice-profile-trainer: wins when the user wants a reusable voice profile derived from
      their samples rather than a draft.
  stage: draft
  source_hash: 5fc6ee4cc4c3
editor:
  description: Surgically edits an EXISTING draft; use for "edit this draft", "polish this",
    "tighten this article". Requires a draft to already exist.
  summary: 'Single-stage surgical editor for a draft that already exists. Input: the full
    draft text or file, plus any brief or established voice; it optionally applies ~/.aai/rules/content.md
    as an enhancement but never depends on it. Process: read the whole draft, diagnose exactly
    what is broken (clarity, structure, voice, pacing, weak open or close) and name the problem
    before touching anything, then make the minimum change that fixes each problem. Adjacent
    paragraphs that are not broken stay untouched, and the author''s voice is preserved so
    the piece becomes more itself rather than more generic. Major structural moves (reordering
    sections, changing the angle, rewriting the lead) are proposed and need a yes before execution.
    Output: the draft edited in place, a short changelog of two to five bullets saying what
    changed and why, and a final gut-check on whether the open earns attention, the close
    delivers, and the middle carries no filler. Refuses to research, to write from scratch
    (no draft means hand off to writer), or to polish a piece that is fundamentally off-brief;
    it says so instead. Pipeline position: the edit stage after writer, and the last stage
    inside writing-team. Fits requests like tightening, clarifying, and cleaning up a post
    or article.'
  requests:
  - Edit this draft
  - Polish this article before I send it
  - Tighten this post, it feels long
  - Make this clearer without changing my voice
  - Clean up this newsletter draft
  - Fix the weak opening and ending of my essay
  - Do a line edit on this and tell me what you changed
  not_for:
  - writer: no draft exists yet and the user has only a brief or notes, so a first draft must
      be written.
  - writing-team: the user wants the whole research, draft and edit pipeline to a publish-ready
      piece, not one edit pass.
  - editorial-desk: the user wants a critiqued, adversarially reviewed and revised opinion
      essay run by multiple specialist contributors.
  - gauntlet: the user wants explicit criteria, independent critics and evidence-based revision
      loops rather than a light edit.
  stage: edit
  source_hash: 486a2dc827ec
writing-team:
  description: Full research -> draft -> edit pipeline to a publish-ready piece; use for "write
    me an article on X end to end", "take this from idea to finished post". Use this when
    the user wants the whole pipeline, not a single stage.
  summary: 'Orchestrator that runs the full research, draft, edit pipeline to take a topic
    from idea to a publish-ready piece by composing the researcher, writer and editor skills
    in strict sequence. Intake happens in one pass: topic or thesis, audience and desired
    reader end-state, voice (from the brief, or a named file under ~/.aai/references/voice/),
    length or format, and source constraints (must-cite, must-not-cite, recency); it asks
    once if anything is missing, then picks a shared kebab-case slug so outputs line up and
    re-runs do not collide. Stage 2 has the researcher write RESEARCH-<slug>.md with an open-questions
    list; stage 3 has the writer draft DRAFT-<slug>.md from the brief and dossier, surfacing
    unverified claims instead of asserting them; stage 4 has the editor edit that draft in
    place. Each stage is resolved by name, first from .aai/skills/<name>/, then .ailib/<name>/,
    then the plugin library, then a sibling folder; if one cannot be resolved it reports which
    is missing and never improvises the stage inline. It runs in the current conversation
    by default, or in a spawned subagent when asked to run separately or in the background.
    Delivery is the final draft path, a three-bullet changelog (what research found, what
    the draft argued, what the edit changed), and any still-unverified claims. Rules: never
    skip the editor pass, never silently drop unsourced facts, keep stage order. Not for single-stage
    requests. Stage: pipeline, end to end.'
  requests:
  - write me an article on remote leadership end to end
  - take this idea from nothing to a finished post
  - research, draft and edit a piece on AI in hiring
  - I need a publish-ready blog post, handle the whole thing
  - run the writing team on this topic in the background
